<style>
:root {
  --bg: #0e0e10; --bar: rgba(14,14,16,.92); --text: #ecebe6; --muted: #9a9890;
  --line: #2a2a2e; --accent: #c8423f; --chip: #1c1c20;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- home: the volumes ---------- */
.display { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight: 400; letter-spacing: .04em; }
#home { min-height: 100%; padding: 48px 20px 64px;
  background: radial-gradient(ellipse at 50% -10%, #1d1a22 0%, var(--bg) 60%); }
.home-head { text-align: center; max-width: 900px; margin: 0 auto 40px; }
.home-head h1 { font-size: clamp(56px, 11vw, 120px); line-height: .9; margin: 0; }
.home-head p { color: var(--muted); margin: 10px 0 0; letter-spacing: .3em; text-transform: uppercase; font-size: 12px; }
.vols { list-style: none; margin: 0 auto; padding: 0; max-width: 1080px;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.volcard { display: block; width: 100%; text-align: left; border-radius: 10px; padding: 0; }
.volcard .poster { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3;
  box-shadow: 0 18px 50px rgba(0,0,0,.55); transition: transform .35s ease, box-shadow .35s ease; }
.volcard img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease, filter .35s; }
.volcard:hover .poster, .volcard:focus-visible .poster { transform: translateY(-6px); box-shadow: 0 28px 70px rgba(0,0,0,.7); }
.volcard:hover img { transform: scale(1.03); }
.volcard:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
.volcard.soon img { filter: saturate(.85) brightness(.85); }
.volcard:hover.soon img { filter: none; }
.badge { position: absolute; top: 12px; left: 12px; padding: 5px 10px; border-radius: 999px; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; font-weight: 700; background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.18); }
.badge.out { background: var(--accent); border-color: transparent; }
.volcard .meta { padding: 14px 4px 0; }
.volcard .meta small { color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-size: 11px; }
.volcard .meta b { display: block; font-size: 30px; line-height: 1.05; margin: 2px 0 6px; }
.volcard .meta span { color: var(--muted); font-size: 14px; }
@media (max-width: 820px) { .vols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; } }
@media (max-width: 520px) { .vols { grid-template-columns: 1fr; max-width: 340px; } #home { padding-top: 32px; } }

/* ---------- coming soon ---------- */
#soon { min-height: 100%; display: grid; place-items: center; padding: 28px 16px 48px;
  background: radial-gradient(ellipse at 50% 0%, #1b1820 0%, var(--bg) 65%); }
.soon-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 360px); gap: 48px; align-items: center; max-width: 880px; }
.soon-wrap img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
.soon-wrap h2 { font-size: clamp(48px, 8vw, 84px); line-height: .9; margin: 4px 0 14px; }
.soon-wrap .kicker { color: var(--muted); letter-spacing: .25em; text-transform: uppercase; font-size: 12px; margin: 0; }
.soon-wrap p { color: #cfcdc6; margin: 0 0 26px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; padding: 6px 0; }
.back:hover { color: var(--text); }
.back svg { width: 18px; height: 18px; }
.topback { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; }
@media (max-width: 760px) {
  .soon-wrap { grid-template-columns: 1fr; gap: 24px; text-align: center; }
  .soon-wrap img { max-width: 300px; margin: 0 auto; }
}

/* ---------- landing (a volume) ---------- */
#landing { position: relative; }
#landing { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.land { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 380px); gap: 48px; align-items: center; max-width: 820px; }
.land img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.land h1 { font-size: clamp(40px, 7vw, 64px); line-height: .95; letter-spacing: .02em; margin: 0 0 12px;
  text-transform: uppercase; font-weight: 800; }
.land h1.display { font-weight: 400; letter-spacing: .03em; font-size: clamp(52px, 8vw, 88px); }
.land .vol { color: var(--muted); margin: 0 0 2px; }
.land .ch { margin: 0 0 28px; font-weight: 600; }
.cta { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 11px 20px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn:focus-visible, .icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.chapters { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 8px; }
.chapters button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; border-radius: 10px;
  background: var(--chip); text-align: left; }
.chapters button:hover { background: #26262b; }
.chapters button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.chapters img { width: 44px; height: 66px; aspect-ratio: auto; object-fit: cover; border-radius: 3px; box-shadow: none; flex: none; }
.chapters b { display: block; font-weight: 600; }
.chapters small { color: var(--muted); font-size: 13px; }
@media (max-width: 700px) {
  .land { grid-template-columns: 1fr; gap: 24px; text-align: center; }
  .land img { max-width: 260px; margin: 0 auto; }
  .chapters img { margin: 0; }
  .cta { justify-content: center; }
}

/* ---------- reader ---------- */
#reader { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--bar); border-bottom: 1px solid var(--line); z-index: 3; transition: transform .25s, opacity .25s; }
.bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.bar .title { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; margin-right: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.icon { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: var(--text); }
.icon:hover { background: var(--chip); }
.icon svg { width: 20px; height: 20px; }
.modes { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; margin: 0 6px; }
.modes button { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: #33333a; color: var(--text); }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 64px; text-align: center; }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 80px; }
#reader.immersive .bar.top { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar.bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar { position: absolute; left: 0; right: 0; }
#reader.immersive .bar.top { top: 0; } #reader.immersive .bar.bottom { bottom: 0; }

.stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 10px; user-select: none; touch-action: pan-y pinch-zoom; }
.stage .spread { display: flex; height: 100%; max-width: 100%; align-items: center; justify-content: center; gap: 0; }
.stage img { display: block; max-height: 100%; max-width: 100%; height: auto; width: auto; object-fit: contain;
  background: #1a1a1d; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.stage .spread.two img { max-width: 50%; }
.stage .spread.wide img { max-width: 100%; }
.hit { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 2; }
.hit.l { left: 0; cursor: w-resize; } .hit.r { right: 0; cursor: e-resize; }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 0 40px; }
.scroll img { display: block; width: min(100%, 900px); height: auto; margin: 0 auto 14px; aspect-ratio: 2/3; background: #1a1a1d; }
.scroll img.wide { width: min(100%, 1800px); aspect-ratio: 4/3; }
.scroll .endcard { margin: 30px auto; }

/* ---------- thumbnails ---------- */
#grid { position: fixed; inset: 0; background: rgba(8,8,10,.97); z-index: 5; overflow-y: auto; padding: 16px; }
#grid header { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto 14px; }
#grid h2 { margin: 0; font-size: 16px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 16px; }
.tabs button { padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.bar .title { cursor: pointer; }
.endcard .btn { margin: 4px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.thumbs button { text-align: center; color: var(--muted); font-size: 12px; }
.thumbs img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 3px; border: 2px solid transparent; display: block; margin-bottom: 4px; }
.thumbs button.current img { border-color: var(--accent); }

/* ---------- end card ---------- */
.endcard { max-width: 420px; text-align: center; padding: 32px 20px; }
.endcard h2 { text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
.endcard p { color: var(--muted); margin: 0 0 22px; }

.hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75);
  color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; pointer-events: none;
  transition: opacity .6s; z-index: 4; white-space: nowrap; }
@media (max-width: 640px) {
  .bar .title span, .hide-sm { display: none; }
  .modes button { padding: 6px 8px; }
}
</style>
</head>
<body>

<section id="reader" class="hidden" aria-label="Comic reader">

    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

</section>

<section id="grid" class="hidden" aria-label="All pages">

    </button></header>
  <div class="tabs hidden" id="tabs" role="group" aria-label="Chapter"></div>
  <div class="thumbs" id="thumbs"></div>
</section>

<script>
const BOOK = {"title": "Secret Lair", "volume": "Volume 1: Field of Thorns", "volumes": [{"n": 1, "title": "Field of Thorns", "blurb": "A dead harbour, a girl with a garden trick, and something under the concrete that knows her name.", "soon": false, "chapters": [1, 2, 3, 4, 5, 6, 7, 8], "planned": 8, "alt": "The Volume 1 cover: Roka under a moon wrapped in thorned roses", "poster": "covers/v1.webp?v=32167814", "card": "covers/v1_t.webp?v=32167814"}, {"n": 2, "title": "Absolute Zero", "blurb": "The coldest girl in the city. A fire that's coming for her.", "soon": false, "chapters": [9, 10], "planned": 8, "alt": "The Volume 2 poster: Jeon in frost, Azelax behind her", "poster": "covers/v2.webp?v=4fe13769", "card": "covers/v2_t.webp?v=4fe13769"}, {"n": 3, "title": "Nine Lives", "blurb": "Two sisters the world split apart.", "soon": true, "chapters": [], "planned": 8, "alt": "The Volume 3 teaser poster: two sisters", "poster": "covers/v3.webp?v=7306b7ef", "card": "covers/v3_t.webp?v=7306b7ef"}], "chapters": [{"n": 1, "name": "Chapter 1: Roots", "pages": [{"n": 1, "src": "pages/c1/01.webp", "thumb": "pages/c1/01_t.webp", "alt": "Twenty-three years ago, the sky went white for nine seconds. No one could explain it. By morning, most people had stopped trying.", "title_page": false}, {"n": 2, "src": "pages/c1/02.webp", "thumb": "pages/c1/02_t.webp", "alt": "Nine months later, the first children were born different.", "title_page": false}, {"n": 3, "src": "pages/c1/03.webp", "thumb": "pages/c1/03_t.webp", "alt": "They called it the Shift. The children were Shifted. Everyone else got a word they'd never needed before. Constant.", "title_page": false}, {"n": 4, "src": "pages/c1/04.webp", "thumb": "pages/c1/04_t.webp", "alt": "At first, the world called it a miracle. Then it called it a problem. Then it called it an opportunity. 1147", "title_page": false}, {"n": 5, "src": "pages/c1/05.webp", "thumb": "pages/c1/05_t.webp", "alt": "Some of the Shifted decided they didn't need anyone's permission. They came at dusk. People started calling them Vesper.", "title_page": false}, {"n": 6, "src": "pages/c1/06.webp", "thumb": "pages/c1/06_t.webp", "alt": "Fifteen years ago, Vesper came to Asheford. Stay with me. Hey. Stay with me. The city survived. Not everyone came out whole.", "title_page": false}, {"n": 7, "src": "pages/c1/07.webp", "thumb": "pages/c1/07_t.webp", "alt": "", "title_page": false}, {"n": 8, "src": "pages/c1/08.webp", "thumb": "pages/c1/08_t.webp", "alt": "Harbour Night: the burning harbour, full page with no words. Turn your device sideways.", "title_page": false}, {"n": 9, "src": "pages/c1/09.webp", "thumb": "pages/c1/09_t.webp", "alt": "FIFTEEN YEARS LATER SECRET LAIR Field of Thorns · Chapter 1: Roots", "title_page": true}, {"n": 10, "src": "pages/c1/10.webp", "thumb": "pages/c1/10_t.webp", "alt": "", "title_page": false}, {"n": 11, "src": "pages/c1/11.webp", "thumb": "pages/c1/11_t.webp", "alt": "You'll open it for us.", "title_page": false}, {"n": 12, "src": "pages/c1/12.webp", "thumb": "pages/c1/12_t.webp", "alt": "", "title_page": false}, {"n": 13, "src": "pages/c1/13.webp", "thumb": "pages/c1/13_t.webp", "alt": "Intake Thirty-One. Forty of us. They say it's the best year the Corps has had in a decade.", "title_page": false}, {"n": 14, "src": "pages/c1/14.webp", "thumb": "pages/c1/14_t.webp", "alt": "Every month, they post the rankings. Mum: Happy birthday, love. 22!! x 34 · 35 · 36 ROKA · 37 I'm thirty-sixth.", "title_page": false}, {"n": 15, "src": "pages/c1/15.webp", "thumb": "pages/c1/15_t.webp", "alt": "You look like you slept in a hedge. Thanks. You've got a follower. He's been with me since the bakery. I keep telling him I can't afford him. Assessment today. I know. Mattyes is grading. I know.", "title_page": false}, {"n": 16, "src": "pages/c1/16.webp", "thumb": "pages/c1/16_t.webp", "alt": "Did you sleep here? No. Is it still pulling? Drifted right under load. Fixed it. Mostly.", "title_page": false}, {"n": 17, "src": "pages/c1/17.webp", "thumb": "pages/c1/17_t.webp", "alt": "Twelve civilians. Six hostiles. Drones are hostiles. Dummies are civilians. Try not to mix them up. Vest goes red, you're out. First group. Go.", "title_page": false}, {"n": 18, "src": "pages/c1/18.webp", "thumb": "pages/c1/18_t.webp", "alt": "Jeon. Ranked first. Eleven seconds. Didn't even touch the dummies.", "title_page": false}, {"n": 19, "src": "pages/c1/19.webp", "thumb": "pages/c1/19_t.webp", "alt": "Cas. Pass. Shibby. Pass. Anna. Pass. Azelax. Pass. Rassy. Pass. Pearl. Pass.", "title_page": false}, {"n": 20, "src": "pages/c1/20.webp", "thumb": "pages/c1/20_t.webp", "alt": "Good reflexes. Good night vision. Next. Next group.", "title_page": false}, {"n": 21, "src": "pages/c1/21.webp", "thumb": "pages/c1/21_t.webp", "alt": "Roka. Out.", "title_page": false}, {"n": 22, "src": "pages/c1/22.webp", "thumb": "pages/c1/22_t.webp", "alt": "…Moiz. Pass. Support track? Plants. Good for search and rescue. …Maybe.", "title_page": false}, {"n": 23, "src": "pages/c1/23.webp", "thumb": "pages/c1/23_t.webp", "alt": "You know what my file says? \"Good reflexes. Good night vision.\" That's it. That's the whole entry. And the cats. And every cat in the city thinks I'm their mum. They left that bit out. Everyone else's power is an answer.", "title_page": false}, {"n": 24, "src": "pages/c1/24.webp", "thumb": "pages/c1/24_t.webp", "alt": "Mine's a garden. I didn't get one at all. Built the first one of these out of scrap when I was fourteen. Weighed a ton. Caught fire twice.", "title_page": false}, {"n": 25, "src": "pages/c1/25.webp", "thumb": "pages/c1/25_t.webp", "alt": "Your power isn't the problem. Nobody's shown you what it's for yet. Hey. You weren't eating it.", "title_page": false}, {"n": 26, "src": "pages/c1/26.webp", "thumb": "pages/c1/26_t.webp", "alt": "Next week's field exercise. Search and rescue. Old harbour district. Inside the fence? Inside the fence. First Intake that's ever been let in.", "title_page": false}, {"n": 27, "src": "pages/c1/27.webp", "thumb": "pages/c1/27_t.webp", "alt": "Teams go up tonight. Dismissed.", "title_page": false}, {"n": 28, "src": "pages/c1/28.webp", "thumb": "pages/c1/28_t.webp", "alt": "Leena: you thought we forgot didn't you Leena: check your bag Moiz: Happy 22nd, Roka. Same roof next year.", "title_page": false}, {"n": 29, "src": "pages/c1/29.webp", "thumb": "pages/c1/29_t.webp", "alt": "The flowers… They're all facing the same way. …Towards the harbour.", "title_page": false}, {"n": 30, "src": "pages/c1/30.webp", "thumb": "pages/c1/30_t.webp", "alt": "Fifteen years.", "title_page": false}], "spreads": [], "cover": "pages/c1/09.webp", "thumb": "pages/c1/09_t.webp"}, {"n": 2, "name": "Chapter 2: The Week", "pages": [{"n": 1, "src": "pages/c2/01.webp", "thumb": "pages/c2/01_t.webp", "alt": "One week before the harbour exercise. SECRET LAIR Field of Thorns · Chapter 2: The Week", "title_page": true}, {"n": 2, "src": "pages/c2/02.webp", "thumb": "pages/c2/02_t.webp", "alt": "It's a seedling. In a little pot. Moiz made a tag for it. Of course he did. Mum. They're sending us into the old harbour. Next week. A rescue drill. …Mum? …Be careful in there. Stay with the others. Promise me.", "title_page": false}, {"n": 3, "src": "pages/c2/03.webp", "thumb": "pages/c2/03_t.webp", "alt": "TEAM FOUR · Roka · Leena · Moiz · Pearl · Tuna", "title_page": false}, {"n": 4, "src": "pages/c2/04.webp", "thumb": "pages/c2/04_t.webp", "alt": "", "title_page": false}, {"n": 5, "src": "pages/c2/05.webp", "thumb": "pages/c2/05_t.webp", "alt": "Leena: who's tuna Roka: no idea Tuna: the guy who sits behind you in briefings, roka Tuna: see you all tomorrow!! Moiz: Pearl. Leena: be nice", "title_page": false}, {"n": 6, "src": "pages/c2/06.webp", "thumb": "pages/c2/06_t.webp", "alt": "Team Four! Roka. Leena. Moiz. Pearl's late. I'm not late. You're about to be. Your heart's going like you ran here. …Okay. I like him.", "title_page": false}, {"n": 7, "src": "pages/c2/07.webp", "thumb": "pages/c2/07_t.webp", "alt": "You can hear heartbeats? Everyone's. All the time. These help. Mostly. Search and rescue, though. Finally a drill where I'm actually useful. Team Four. Course. Now.", "title_page": false}, {"n": 8, "src": "pages/c2/08.webp", "thumb": "pages/c2/08_t.webp", "alt": "Team Four. Three civilians. Go. Thirty seconds and their sensors are blind— Done. Civilian crushed. Tuna, you're out. …Ow?", "title_page": false}, {"n": 9, "src": "pages/c2/09.webp", "thumb": "pages/c2/09_t.webp", "alt": "", "title_page": false}, {"n": 10, "src": "pages/c2/10.webp", "thumb": "pages/c2/10_t.webp", "alt": "All five out. Zero civilians saved. Again. You could've said you were using it. You could've waited thirty seconds. Children. Four hours later. Again. My heart's fine, by the way. Nobody asked.", "title_page": false}, {"n": 11, "src": "pages/c2/11.webp", "thumb": "pages/c2/11_t.webp", "alt": "", "title_page": false}, {"n": 12, "src": "pages/c2/12.webp", "thumb": "pages/c2/12_t.webp", "alt": "Mattyes says we build the team radios. Together. Sit. Three hours in. You drew all of these? Since I was eight. I built the arm myself.", "title_page": false}, {"n": 13, "src": "pages/c2/13.webp", "thumb": "pages/c2/13_t.webp", "alt": "The wrist joint. You rebuilt it. Four times. It still slips. Your connector's the wrong size. I know. Nobody makes one that small. Later. Pearl's gone home. She made one. The right size. …It fits.", "title_page": false}, {"n": 14, "src": "pages/c2/14.webp", "thumb": "pages/c2/14_t.webp", "alt": "Wednesday. I cut it back on Monday. It's grown through the tape overnight. Am I doing this in my sleep? …Fine. Stay.", "title_page": false}, {"n": 15, "src": "pages/c2/15.webp", "thumb": "pages/c2/15_t.webp", "alt": "Thursday. Cards are a classic. Cards are a magic trick. Sorry— sorry—! …Show-off. You're welcome.", "title_page": false}, {"n": 16, "src": "pages/c2/16.webp", "thumb": "pages/c2/16_t.webp", "alt": "We are not doing this. She likes you. Anna's wing's sprained. She won't tell anyone. Cas owes Shibby lunch. How do you know all that? I listen.", "title_page": false}, {"n": 17, "src": "pages/c2/17.webp", "thumb": "pages/c2/17_t.webp", "alt": "Friday. Faster than Monday. Still a mess. Jeon. Ranked first. Practising alone, at night?", "title_page": false}, {"n": 18, "src": "pages/c2/18.webp", "thumb": "pages/c2/18_t.webp", "alt": "You can come out. I thought it was easy for you. It looks easy. That's the point. Your vines. On the assessment. They grew around the dummies. Not through them. …I didn't notice. That's control. Took me two years to learn it.", "title_page": false}, {"n": 19, "src": "pages/c2/19.webp", "thumb": "pages/c2/19_t.webp", "alt": "", "title_page": false}, {"n": 20, "src": "pages/c2/20.webp", "thumb": "pages/c2/20_t.webp", "alt": "Saturday. In the park, every flower still faces the harbour. They won't go in. Any of them. Something in there's scaring them.", "title_page": false}, {"n": 21, "src": "pages/c2/21.webp", "thumb": "pages/c2/21_t.webp", "alt": "", "title_page": false}, {"n": 22, "src": "pages/c2/22.webp", "thumb": "pages/c2/22_t.webp", "alt": "Couldn't sleep. Me neither.", "title_page": false}, {"n": 23, "src": "pages/c2/23.webp", "thumb": "pages/c2/23_t.webp", "alt": "I was eight when the harbour burned. I don't remember much. Fire. Noise. Shoes. Someone walked right past me. Didn't even slow down.", "title_page": false}, {"n": 24, "src": "pages/c2/24.webp", "thumb": "pages/c2/24_t.webp", "alt": "", "title_page": false}, {"n": 25, "src": "pages/c2/25.webp", "thumb": "pages/c2/25_t.webp", "alt": "…Thanks. I didn't do anything. You stayed.", "title_page": false}, {"n": 26, "src": "pages/c2/26.webp", "thumb": "pages/c2/26_t.webp", "alt": "Sunday. Channel four. Don't touch the dial. Everyone's heart's going way too fast. Mine too. Tomorrow's the harbour. Wow. Thanks, Tuna. Very calming.", "title_page": false}, {"n": 27, "src": "pages/c2/27.webp", "thumb": "pages/c2/27_t.webp", "alt": "Stay with your team. Radios on. Lose your team, you come straight back to this gate. This is the Senior Warden, going in ahead of you. Any order from the Warden, you follow it. That scarf. I've seen it before. Where?", "title_page": false}, {"n": 28, "src": "pages/c2/28.webp", "thumb": "pages/c2/28_t.webp", "alt": "Team Four. Right on time.", "title_page": false}, {"n": 29, "src": "pages/c2/29.webp", "thumb": "pages/c2/29_t.webp", "alt": "", "title_page": false}], "spreads": [], "cover": "pages/c2/01.webp", "thumb": "pages/c2/01_t.webp"}, {"n": 3, "name": "Chapter 3: Vesper", "pages": [{"n": 1, "src": "pages/c3/01.webp", "thumb": "pages/c3/01_t.webp", "alt": "The same morning. Gina. They're through the gate. All forty, inside the fence. Team Four? Right on schedule. Then come home. On my way.", "title_page": false}, {"n": 2, "src": "pages/c3/02.webp", "thumb": "pages/c3/02_t.webp", "alt": "", "title_page": false}, {"n": 3, "src": "pages/c3/03.webp", "thumb": "pages/c3/03_t.webp", "alt": "LINE 4 - STATION CLOSED", "title_page": false}, {"n": 4, "src": "pages/c3/04.webp", "thumb": "pages/c3/04_t.webp", "alt": "", "title_page": false}, {"n": 5, "src": "pages/c3/05.webp", "thumb": "pages/c3/05_t.webp", "alt": "Under the closed Line 4 station. This is where Vesper lives. SECRET LAIR Field of Thorns · Chapter 3: Vesper", "title_page": true}, {"n": 6, "src": "pages/c3/06.webp", "thumb": "pages/c3/06_t.webp", "alt": "Zeyno. She's been lighting birthday candles since she was seven. Zeyno. Will the Corps find us down here? Not today. Make a wish.", "title_page": false}, {"n": 7, "src": "pages/c3/07.webp", "thumb": "pages/c3/07_t.webp", "alt": "Gina's back! Did you eat today? The cat did. Eat something. You, not the cat.", "title_page": false}, {"n": 8, "src": "pages/c3/08.webp", "thumb": "pages/c3/08_t.webp", "alt": "The far end of the platform. Where Vesper plans. Sicario. Gina's back. Good. Then we go now, while the gates are open. No. We wait for dusk. Forty trainees and a handful of Wardens. We could walk through them. We're not going for the trainees.", "title_page": false}, {"n": 9, "src": "pages/c3/09.webp", "thumb": "pages/c3/09_t.webp", "alt": "", "title_page": false}, {"n": 10, "src": "pages/c3/10.webp", "thumb": "pages/c3/10_t.webp", "alt": "The Corps sent forty trainees inside the fence today. A search-and-rescue drill. The gates stay open until dusk. That's when we go in. Zaytoona. My bats are already over the fence. By tonight I'll know where every team is. Tacos. And the Wardens? Six of them. One I don't like. Checked scarf, curved blade. The one with the glowing blade. Then nobody goes near that one.", "title_page": false}, {"n": 11, "src": "pages/c3/11.webp", "thumb": "pages/c3/11_t.webp", "alt": "Aurora. He's listening to the dead again. It's louder today. The dead? Everyone who died on Harbour Night is still down there. But there's something under them. Something under the harbour is waking up.", "title_page": false}, {"n": 12, "src": "pages/c3/12.webp", "thumb": "pages/c3/12_t.webp", "alt": "Don't. It's loud enough in my head already. Sicario. Leave him alone. Unknown: Wardens pull back to Gate Three at 18:30. Unknown: Gate closes 19:40. Team positions attached. Unknown: Team Four will be closest to the old dock. Who keeps sending us these?", "title_page": false}, {"n": 13, "src": "pages/c3/13.webp", "thumb": "pages/c3/13_t.webp", "alt": "", "title_page": false}, {"n": 14, "src": "pages/c3/14.webp", "thumb": "pages/c3/14_t.webp", "alt": "Someone inside the Corps who wants the same thing we do. That's not comforting. Dusk. Zaytoona's bats go first. Tacos, you take the cranes. Sicario, the gate. Aurora, you find what's waking up. I don't have to find it. I can hear it.", "title_page": false}, {"n": 15, "src": "pages/c3/15.webp", "thumb": "pages/c3/15_t.webp", "alt": "", "title_page": false}, {"n": 16, "src": "pages/c3/16.webp", "thumb": "pages/c3/16_t.webp", "alt": "And me? He wants to see you first.", "title_page": false}, {"n": 17, "src": "pages/c3/17.webp", "thumb": "pages/c3/17_t.webp", "alt": "", "title_page": false}, {"n": 18, "src": "pages/c3/18.webp", "thumb": "pages/c3/18_t.webp", "alt": "The man with no face. Vesper's leader. They're all inside the fence.", "title_page": false}, {"n": 19, "src": "pages/c3/19.webp", "thumb": "pages/c3/19_t.webp", "alt": "", "title_page": false}, {"n": 20, "src": "pages/c3/20.webp", "thumb": "pages/c3/20_t.webp", "alt": "The girl with the vines? She's ranked thirty-sixth. She can barely grow a hedge. She's grown.", "title_page": false}, {"n": 21, "src": "pages/c3/21.webp", "thumb": "pages/c3/21_t.webp", "alt": "", "title_page": false}, {"n": 22, "src": "pages/c3/22.webp", "thumb": "pages/c3/22_t.webp", "alt": "", "title_page": false}, {"n": 23, "src": "pages/c3/23.webp", "thumb": "pages/c3/23_t.webp", "alt": "The Constant with the arm? He's nobody. I've never seen him look at anyone that long.", "title_page": false}, {"n": 24, "src": "pages/c3/24.webp", "thumb": "pages/c3/24_t.webp", "alt": "Afternoon. Do you think about them? If tonight goes wrong. Every day. That's why it can't go wrong. Fewer of us are born every year. The Shift is fading. Twenty more years and there won't be any more of us. They know that. They're just waiting us out.", "title_page": false}, {"n": 25, "src": "pages/c3/25.webp", "thumb": "pages/c3/25_t.webp", "alt": "And he can stop it? He's the only one who's tried. Orders. The girl with the vines comes back alive. Nobody touches her. And the rest of Team Four? He didn't say.", "title_page": false}, {"n": 26, "src": "pages/c3/26.webp", "thumb": "pages/c3/26_t.webp", "alt": "", "title_page": false}, {"n": 27, "src": "pages/c3/27.webp", "thumb": "pages/c3/27_t.webp", "alt": "Stay down here tonight. I always do.", "title_page": false}, {"n": 28, "src": "pages/c3/28.webp", "thumb": "pages/c3/28_t.webp", "alt": "", "title_page": false}, {"n": 29, "src": "pages/c3/29.webp", "thumb": "pages/c3/29_t.webp", "alt": "Dusk. Vesper night. Everybody inside. It knows we're coming.", "title_page": false}, {"n": 30, "src": "pages/c3/30.webp", "thumb": "pages/c3/30_t.webp", "alt": "Inside the fence. …and that's why Mattyes hates me. Mattyes hates everyone. …Hang on.", "title_page": false}, {"n": 31, "src": "pages/c3/31.webp", "thumb": "pages/c3/31_t.webp", "alt": "", "title_page": false}, {"n": 32, "src": "pages/c3/32.webp", "thumb": "pages/c3/32_t.webp", "alt": "There are heartbeats out there. A lot of them. Other teams? No. They're coming toward us. A Vesper night.", "title_page": false}], "spreads": [], "cover": "pages/c3/05.webp", "thumb": "pages/c3/05_t.webp"}, {"n": 4, "name": "Chapter 4: Inside the Fence", "pages": [{"n": 1, "src": "pages/c4/01.webp", "thumb": "pages/c4/01_t.webp", "alt": "The same morning. Inside the fence. SECRET LAIR Field of Thorns · Chapter 4: Inside the Fence", "title_page": true}, {"n": 2, "src": "pages/c4/02.webp", "thumb": "pages/c4/02_t.webp", "alt": "Forty mannequins are hidden in this district. Those are your civilians. Find them, carry them out to the gate. Radios on, all day. The gate closes at 19:40. Anyone still inside at 19:40 fails. Nineteen-forty. Nobody's eating lunch, then.", "title_page": false}, {"n": 3, "src": "pages/c4/03.webp", "thumb": "pages/c4/03_t.webp", "alt": "Who is he? Someone you listen to.", "title_page": false}, {"n": 4, "src": "pages/c4/04.webp", "thumb": "pages/c4/04_t.webp", "alt": "The old harbour district. Closed for fifteen years. Who plants thorns in a harbour? Nobody planted these. They're fifteen years old and they're not dead.", "title_page": false}, {"n": 5, "src": "pages/c4/05.webp", "thumb": "pages/c4/05_t.webp", "alt": "It moved. Like it knew me.", "title_page": false}, {"n": 6, "src": "pages/c4/06.webp", "thumb": "pages/c4/06_t.webp", "alt": "Roka? You okay? Fine. Just cold. That was easy. Why was that easy? Thirty-sixth? That's not a thirty-sixth.", "title_page": false}, {"n": 7, "src": "pages/c4/07.webp", "thumb": "pages/c4/07_t.webp", "alt": "", "title_page": false}, {"n": 8, "src": "pages/c4/08.webp", "thumb": "pages/c4/08_t.webp", "alt": "The old dock. Where the cranes came down on Harbour Night. He's walking straight at it. His heart's calm. Totally calm. That's the weird part.", "title_page": false}, {"n": 9, "src": "pages/c4/09.webp", "thumb": "pages/c4/09_t.webp", "alt": "Moiz. We can search somewhere else. The mannequins are where people would've been. People were at the dock. Then we do the dock. Together.", "title_page": false}, {"n": 10, "src": "pages/c4/10.webp", "thumb": "pages/c4/10_t.webp", "alt": "In there. Something's ticking. Like a heartbeat. A metronome. They're testing you, Tuna. Then I passed. Moiz, now!", "title_page": false}, {"n": 11, "src": "pages/c4/11.webp", "thumb": "pages/c4/11_t.webp", "alt": "Left. Left. Down. Clear. Got one!", "title_page": false}, {"n": 12, "src": "pages/c4/12.webp", "thumb": "pages/c4/12_t.webp", "alt": "Team Four. Three civilians saved. …Not bad. He said \"not bad\"! Write that down!", "title_page": false}, {"n": 13, "src": "pages/c4/13.webp", "thumb": "pages/c4/13_t.webp", "alt": "Jeon's team. Coming through! She found one.", "title_page": false}, {"n": 14, "src": "pages/c4/14.webp", "thumb": "pages/c4/14_t.webp", "alt": "North is up. Not on this map.", "title_page": false}, {"n": 15, "src": "pages/c4/15.webp", "thumb": "pages/c4/15_t.webp", "alt": "Afternoon. Twenty-two of forty found. Eighteen left. We can get five more before the gate closes. The dock first.", "title_page": false}, {"n": 16, "src": "pages/c4/16.webp", "thumb": "pages/c4/16_t.webp", "alt": "Bats. In the middle of the day. They're not asleep. They're watching the teams.", "title_page": false}, {"n": 17, "src": "pages/c4/17.webp", "thumb": "pages/c4/17_t.webp", "alt": "Bats don't do that. Animals don't watch people like that. And the cats still won't come in. Maybe they know something we don't.", "title_page": false}, {"n": 18, "src": "pages/c4/18.webp", "thumb": "pages/c4/18_t.webp", "alt": "This is where it happened.", "title_page": false}, {"n": 19, "src": "pages/c4/19.webp", "thumb": "pages/c4/19_t.webp", "alt": "", "title_page": false}, {"n": 20, "src": "pages/c4/20.webp", "thumb": "pages/c4/20_t.webp", "alt": "I was under that. For hours. He's never said that out loud before.", "title_page": false}, {"n": 21, "src": "pages/c4/21.webp", "thumb": "pages/c4/21_t.webp", "alt": "These were mine. You okay? …Yeah. Let's find the next one.", "title_page": false}, {"n": 22, "src": "pages/c4/22.webp", "thumb": "pages/c4/22_t.webp", "alt": "18:30. All Wardens. Fall back to Gate Three. Now. Wardens? Only the Wardens?", "title_page": false}, {"n": 23, "src": "pages/c4/23.webp", "thumb": "pages/c4/23_t.webp", "alt": "That's not the plan. Who gave that order? …Who gave that order? Team Four was the furthest team from the gate.", "title_page": false}, {"n": 24, "src": "pages/c4/24.webp", "thumb": "pages/c4/24_t.webp", "alt": "18:45. The radio's working. Nobody's answering. We'll walk back after this. Five minutes. …and that's why Mattyes hates me. Mattyes hates everyone.", "title_page": false}, {"n": 25, "src": "pages/c4/25.webp", "thumb": "pages/c4/25_t.webp", "alt": "", "title_page": false}, {"n": 26, "src": "pages/c4/26.webp", "thumb": "pages/c4/26_t.webp", "alt": "…Hang on. There are heartbeats out there. A lot of them. Other teams? No. They're coming toward us.", "title_page": false}, {"n": 27, "src": "pages/c4/27.webp", "thumb": "pages/c4/27_t.webp", "alt": "", "title_page": false}, {"n": 28, "src": "pages/c4/28.webp", "thumb": "pages/c4/28_t.webp", "alt": "Team Four, come back to the gate. Now. Dusk.", "title_page": false}, {"n": 29, "src": "pages/c4/29.webp", "thumb": "pages/c4/29_t.webp", "alt": "", "title_page": false}], "spreads": [], "cover": "pages/c4/01.webp", "thumb": "pages/c4/01_t.webp"}, {"n": 5, "name": "Chapter 5: Vesper at Dusk", "pages": [{"n": 1, "src": "pages/c5/01.webp", "thumb": "pages/c5/01_t.webp", "alt": "CHAPTER 5 VESPER AT DUSK", "title_page": true}, {"n": 2, "src": "pages/c5/02.webp", "thumb": "pages/c5/02_t.webp", "alt": "Everybody down. The footsteps stopped. Someone's standing in the road. That's our way back to the gate.", "title_page": false}, {"n": 3, "src": "pages/c5/03.webp", "thumb": "pages/c5/03_t.webp", "alt": "Zeyno. Vesper. Roka. Come with me and your friends can go.", "title_page": false}, {"n": 4, "src": "pages/c5/04.webp", "thumb": "pages/c5/04_t.webp", "alt": "How do you know my name? I know what your plants did when you were seven. Drones. We have to move. They came for me. We can reach the gate along the water.", "title_page": false}, {"n": 5, "src": "pages/c5/05.webp", "thumb": "pages/c5/05_t.webp", "alt": "Leave the mannequins. Help anyone who can't walk. Sicario. Vesper. Anna, get them out. I'll hold this side.", "title_page": false}, {"n": 6, "src": "pages/c5/06.webp", "thumb": "pages/c5/06_t.webp", "alt": "Jeon. I need a second. They still tell you to hold until they come for you?", "title_page": false}, {"n": 7, "src": "pages/c5/07.webp", "thumb": "pages/c5/07_t.webp", "alt": "Last one's through. With me. Is that everybody? Team Four's still at the old dock.", "title_page": false}, {"n": 8, "src": "pages/c5/08.webp", "thumb": "pages/c5/08_t.webp", "alt": "Wait. One of my cats can see around the corner. Tacos. Vesper. Roka, down the steps. Bow!", "title_page": false}, {"n": 9, "src": "pages/c5/09.webp", "thumb": "pages/c5/09_t.webp", "alt": "Zeyno told us to bring you back. She didn't say you had to walk. I hear him. On your left. Coming around the bollard. I only called the green ones.", "title_page": false}, {"n": 10, "src": "pages/c5/10.webp", "thumb": "pages/c5/10_t.webp", "alt": "I have their drones. All three. You can see him now. Go. Leena, back!", "title_page": false}, {"n": 11, "src": "pages/c5/11.webp", "thumb": "pages/c5/11_t.webp", "alt": "He's cut off. Move. There. Gate Three. I can see somebody. One more. Above us.", "title_page": false}, {"n": 12, "src": "pages/c5/12.webp", "thumb": "pages/c5/12_t.webp", "alt": "A heartbeat. On that roof. Roka!", "title_page": false}, {"n": 13, "src": "pages/c5/13.webp", "thumb": "pages/c5/13_t.webp", "alt": "Down! Gina. Vesper.", "title_page": false}, {"n": 14, "src": "pages/c5/14.webp", "thumb": "pages/c5/14_t.webp", "alt": "Tuna?", "title_page": false}, {"n": 15, "src": "pages/c5/15.webp", "thumb": "pages/c5/15_t.webp", "alt": "My heartbeat. I can't hear it anymore. Everything feels so quiet.", "title_page": false}, {"n": 16, "src": "pages/c5/16.webp", "thumb": "pages/c5/16_t.webp", "alt": "", "title_page": false}, {"n": 17, "src": "pages/c5/17.webp", "thumb": "pages/c5/17_t.webp", "alt": "Tuna? Squeeze my hand. Gate Three. Please answer. It's Tuna. Roka. He's gone.", "title_page": false}, {"n": 18, "src": "pages/c5/18.webp", "thumb": "pages/c5/18_t.webp", "alt": "", "title_page": false}, {"n": 19, "src": "pages/c5/19.webp", "thumb": "pages/c5/19_t.webp", "alt": "He pulled me out of the way. I've got him. Under the crane. Go.", "title_page": false}, {"n": 20, "src": "pages/c5/20.webp", "thumb": "pages/c5/20_t.webp", "alt": "You said they could go.", "title_page": false}, {"n": 21, "src": "pages/c5/21.webp", "thumb": "pages/c5/21_t.webp", "alt": "I did. Stay out.", "title_page": false}, {"n": 22, "src": "pages/c5/22.webp", "thumb": "pages/c5/22_t.webp", "alt": "Team Four, do you copy? Four alive. We're under the old crane. I hear you. Stay under cover.", "title_page": false}, {"n": 23, "src": "pages/c5/23.webp", "thumb": "pages/c5/23_t.webp", "alt": "We came in as five. She knew me. From where?", "title_page": false}, {"n": 24, "src": "pages/c5/24.webp", "thumb": "pages/c5/24_t.webp", "alt": "There's something behind this wall.", "title_page": false}], "spreads": [], "cover": "pages/c5/01.webp", "thumb": "pages/c5/01_t.webp"}, {"n": 6, "name": "Chapter 6: Under the Crane", "pages": [{"n": 1, "src": "pages/c6/01.webp", "thumb": "pages/c6/01_t.webp", "alt": "CHAPTER 6 UNDER THE CRANE", "title_page": true}, {"n": 2, "src": "pages/c6/02.webp", "thumb": "pages/c6/02_t.webp", "alt": "Roka. Step away from it. Pearl. I need light. …Here.", "title_page": false}, {"n": 3, "src": "pages/c6/03.webp", "thumb": "pages/c6/03_t.webp", "alt": "There are steps. Going down. The walls are carved. Like writing. I can't read it. That isn't on any map of these docks. I've seen all of them.", "title_page": false}, {"n": 4, "src": "pages/c6/04.webp", "thumb": "pages/c6/04_t.webp", "alt": "There's air coming up. It goes a long way down. Not tonight.", "title_page": false}, {"n": 5, "src": "pages/c6/05.webp", "thumb": "pages/c6/05_t.webp", "alt": "It closed when I let go. They moved for me. Like they did this morning. Then don't touch them again. Please.", "title_page": false}, {"n": 6, "src": "pages/c6/06.webp", "thumb": "pages/c6/06_t.webp", "alt": "My cat on the fence can see the quay. They're leaving. All of them. Gate Three. Vesper's pulling out. We see it. Stay put. We have to clear the yard first.", "title_page": false}, {"n": 7, "src": "pages/c6/07.webp", "thumb": "pages/c6/07_t.webp", "alt": "They waited three hours. He'd have heard them coming. Before any of us.", "title_page": false}, {"n": 8, "src": "pages/c6/08.webp", "thumb": "pages/c6/08_t.webp", "alt": "He pulled me down. It should have been me. Don't.", "title_page": false}, {"n": 9, "src": "pages/c6/09.webp", "thumb": "pages/c6/09_t.webp", "alt": "Zeyno said she knows what my plants did when I was seven. What did they do? I don't know. I don't remember much from when I was seven.", "title_page": false}, {"n": 10, "src": "pages/c6/10.webp", "thumb": "pages/c6/10_t.webp", "alt": "Team Four! It's Mattyes. Open up. …I'm sorry. Anyone else hurt? No.", "title_page": false}, {"n": 11, "src": "pages/c6/11.webp", "thumb": "pages/c6/11_t.webp", "alt": "Nobody goes near this wall. Understood.", "title_page": false}, {"n": 12, "src": "pages/c6/12.webp", "thumb": "pages/c6/12_t.webp", "alt": "…I know that scarf. Moiz? It's nothing.", "title_page": false}, {"n": 13, "src": "pages/c6/13.webp", "thumb": "pages/c6/13_t.webp", "alt": "Is that— Thirty-nine. Forty of us went in.", "title_page": false}, {"n": 14, "src": "pages/c6/14.webp", "thumb": "pages/c6/14_t.webp", "alt": "Dawn. Missed calls Mum: I saw the news. Are you hurt? Call me. \"Be careful in there.\" She said it like she knew.", "title_page": false}, {"n": 15, "src": "pages/c6/15.webp", "thumb": "pages/c6/15_t.webp", "alt": "A Vesper attack in the old harbour district last night. One Corps trainee was killed. VESPER ATTACK — OLD HARBOUR The Corps says the harbour is secured. They didn't say anything about the wall. Or the steps.", "title_page": false}, {"n": 16, "src": "pages/c6/16.webp", "thumb": "pages/c6/16_t.webp", "alt": "Something is under the harbour. And they're already pretending it isn't.", "title_page": false}], "spreads": [], "cover": "pages/c6/01.webp", "thumb": "pages/c6/01_t.webp"}, {"n": 7, "name": "Chapter 7: Headphones", "pages": [{"n": 1, "src": "pages/c7/01.webp", "thumb": "pages/c7/01_t.webp", "alt": "Two days after the harbour. CHAPTER 7 HEADPHONES", "title_page": true}, {"n": 2, "src": "pages/c7/02.webp", "thumb": "pages/c7/02_t.webp", "alt": "There were steps under the loading bay. Cut into the rock, going down. The walls were carved. Like writing. There was no wall. The bay is an empty concrete shell. We've checked. Zeyno knew my name. She came for me. Put it out of your mind, Trainee.", "title_page": false}, {"n": 3, "src": "pages/c7/03.webp", "thumb": "pages/c7/03_t.webp", "alt": "At half six someone ordered every Warden back to Gate Three. Who? Vesper broke into our channel. The order was a fake. It came on the Corps frequency. In a Corps voice. That will be all. Nobody in this building gave that order!", "title_page": false}, {"n": 4, "src": "pages/c7/04.webp", "thumb": "pages/c7/04_t.webp", "alt": "I've asked every officer in this building. Nobody gave it. Then Vesper gave it. Drop it, Mattyes. My Wardens walked away from forty trainees. One of them is dead. I said drop it. He doesn't believe it either.", "title_page": false}, {"n": 5, "src": "pages/c7/05.webp", "thumb": "pages/c7/05_t.webp", "alt": "The new rankings went up that afternoon. INTAKE THIRTY-ONE — 39 TRAINEES They took him off. They didn't even leave a gap.", "title_page": false}, {"n": 6, "src": "pages/c7/06.webp", "thumb": "pages/c7/06_t.webp", "alt": "…Notice from the Corps. CORPS NOTICE Trainee Moiz is moved to the support track. After recent events, a Constant on the front line is a liability. \"After recent events.\" They're using Tuna to do it. It's not Mattyes's name on it.", "title_page": false}, {"n": 7, "src": "pages/c7/07.webp", "thumb": "pages/c7/07_t.webp", "alt": "Moiz. Where are you going? Workshop. He didn't argue. He went back to work. Moiz. It's Pearl.", "title_page": false}, {"n": 8, "src": "pages/c7/08.webp", "thumb": "pages/c7/08_t.webp", "alt": "The drones I took were Vesper's. They were up over the harbour before the attack started. If anything saw who moved the Wardens, they did. But I let go of all three when the Wardens came in. They fell. They're gone. One came down on the crane. I took this. You've had a piece of a Vesper drone in your pocket for two days? I keep everything.", "title_page": false}, {"n": 9, "src": "pages/c7/09.webp", "thumb": "pages/c7/09_t.webp", "alt": "It's dead. I can only talk to machines that work. Then I'll make it work. They worked through the night. That's the wrong board. It's the board I have.", "title_page": false}, {"n": 10, "src": "pages/c7/10.webp", "thumb": "pages/c7/10_t.webp", "alt": "…I'm in. 18:24. Six minutes before the order. Vesper's drones were already over the harbour. 18:24 18:30. The order. The Wardens leave. 18:30 So Vesper was in place before the order came. They knew it was coming. Someone told them.", "title_page": false}, {"n": 11, "src": "pages/c7/11.webp", "thumb": "pages/c7/11_t.webp", "alt": "I need the old dock layout to check the drone's angle. HARBOUR NIGHT — 15 YEARS AGO That's me. It was him.", "title_page": false}, {"n": 12, "src": "pages/c7/12.webp", "thumb": "pages/c7/12_t.webp", "alt": "", "title_page": false}, {"n": 13, "src": "pages/c7/13.webp", "thumb": "pages/c7/13_t.webp", "alt": "Find anything? Just the layout. You two were alone all night and nobody's dead. That's growth.", "title_page": false}, {"n": 14, "src": "pages/c7/14.webp", "thumb": "pages/c7/14_t.webp", "alt": "Vesper knew the order was coming. We post this. Everywhere. Today. They'd wipe it in an hour. Then they'd come for whoever posted it. Then we go back to the wall. If they're lying about the order, they're lying about the steps.", "title_page": false}, {"n": 15, "src": "pages/c7/15.webp", "thumb": "pages/c7/15_t.webp", "alt": "No. You don't get to decide that. That harbour took my arm. It took Tuna. I'm not going to stand there and watch it take you. Roka— I need some air.", "title_page": false}, {"n": 16, "src": "pages/c7/16.webp", "thumb": "pages/c7/16_t.webp", "alt": "Tuna's memorial was held on the drill yard. He heard the danger before any of us. And then he moved. Where's your jacket? With Tuna.", "title_page": false}, {"n": 17, "src": "pages/c7/17.webp", "thumb": "pages/c7/17_t.webp", "alt": "He'd hate this. Way too quiet. He'd have put music on. Bad music. Stop making jokes. Stop.", "title_page": false}, {"n": 18, "src": "pages/c7/18.webp", "thumb": "pages/c7/18_t.webp", "alt": "Pearl kept his headphones. I still can't hear what he heard. Moiz didn't go home. 3:12 a.m. I didn't do that. …Did I?", "title_page": false}, {"n": 19, "src": "pages/c7/19.webp", "thumb": "pages/c7/19_t.webp", "alt": "That's the third night you've done that. Fine. Show me. Floodlights? At this hour?", "title_page": false}, {"n": 20, "src": "pages/c7/20.webp", "thumb": "pages/c7/20_t.webp", "alt": "Go on. Get closer. They're cutting Roka's vines.", "title_page": false}, {"n": 21, "src": "pages/c7/21.webp", "thumb": "pages/c7/21_t.webp", "alt": "They're burying it.", "title_page": false}], "spreads": [], "cover": "pages/c7/01.webp", "thumb": "pages/c7/01_t.webp"}, {"n": 8, "name": "Chapter 8: Taken", "pages": [{"n": 1, "src": "pages/c8/01.webp", "thumb": "pages/c8/01_t.webp", "alt": "Five in the morning. CHAPTER 8 TAKEN", "title_page": true}, {"n": 2, "src": "pages/c8/02.webp", "thumb": "pages/c8/02_t.webp", "alt": "Trucks. Floodlights. A whole crew of Wardens. They're pouring concrete into the loading bay. Into the wall. They're burying it. They're burying it. She knows something. Mum worked nights at the harbour back then. She's never once talked about it.", "title_page": false}, {"n": 3, "src": "pages/c8/03.webp", "thumb": "pages/c8/03_t.webp", "alt": "Across the city. Mum's. Roka! It's a Tuesday. You never come on a Tuesday. I saw the news about that boy. I'm so sorry, love. Were you close? His name was Tuna. Mum. Were we at the harbour that night?", "title_page": false}, {"n": 4, "src": "pages/c8/04.webp", "thumb": "pages/c8/04_t.webp", "alt": "You had a fever. You were in bed all night. You don't remember anything. I didn't say which night. ...There's only one night anyone means.", "title_page": false}, {"n": 5, "src": "pages/c8/05.webp", "thumb": "pages/c8/05_t.webp", "alt": "Wait. I was there.", "title_page": false}, {"n": 6, "src": "pages/c8/06.webp", "thumb": "pages/c8/06_t.webp", "alt": "Go home, love. Please. I'll come back tomorrow. And you're going to tell me.", "title_page": false}, {"n": 7, "src": "pages/c8/07.webp", "thumb": "pages/c8/07_t.webp", "alt": "The next day. Mum? She'd never leave this.", "title_page": false}, {"n": 8, "src": "pages/c8/08.webp", "thumb": "pages/c8/08_t.webp", "alt": "Two men in grey, last night. Corps cars. She went with them. Didn't even take her coat. Because I asked her. Everyone who knows is lying. Or gone.", "title_page": false}, {"n": 9, "src": "pages/c8/09.webp", "thumb": "pages/c8/09_t.webp", "alt": "That night. If they're burying it, it's real.", "title_page": false}, {"n": 10, "src": "pages/c8/10.webp", "thumb": "pages/c8/10_t.webp", "alt": "They took the wall. They took Mum. All my life I've held back. Not tonight.", "title_page": false}, {"n": 11, "src": "pages/c8/11.webp", "thumb": "pages/c8/11_t.webp", "alt": "", "title_page": false}, {"n": 12, "src": "pages/c8/12.webp", "thumb": "pages/c8/12_t.webp", "alt": "Something's pulling back. It knows me. No. No, no.", "title_page": false}, {"n": 13, "src": "pages/c8/13.webp", "thumb": "pages/c8/13_t.webp", "alt": "My cats followed you. I followed my cats. You said you'd never come back here. Floodlights come back on at two. We go. Now.", "title_page": false}, {"n": 14, "src": "pages/c8/14.webp", "thumb": "pages/c8/14_t.webp", "alt": "", "title_page": false}, {"n": 15, "src": "pages/c8/15.webp", "thumb": "pages/c8/15_t.webp", "alt": "Corps HQ. The next morning. Is it holding? For now. And the mother? Somewhere she can't talk.", "title_page": false}, {"n": 16, "src": "pages/c8/16.webp", "thumb": "pages/c8/16_t.webp", "alt": "Training started again. Front line, this side. Support, at the back. Jeon. Azelax. Anna. City duty from Monday. One squad. ...Looks like it's the three of us. This says you're support. Thermal camera. It finds people under rubble.", "title_page": false}, {"n": 17, "src": "pages/c8/17.webp", "thumb": "pages/c8/17_t.webp", "alt": "That was Tuna's job. Front line, then. Fall in!", "title_page": false}, {"n": 18, "src": "pages/c8/18.webp", "thumb": "pages/c8/18_t.webp", "alt": "The roof. They took my mum because I asked her a question. And under that concrete, something knew me. It reached back. Then we find out where she is.", "title_page": false}, {"n": 19, "src": "pages/c8/19.webp", "thumb": "pages/c8/19_t.webp", "alt": "The frames stay on this. Nobody posts. Nobody hears about them. Until we know who gave the order. They kept the frames hidden. And they kept each other.", "title_page": false}, {"n": 20, "src": "pages/c8/20.webp", "thumb": "pages/c8/20_t.webp", "alt": "Under the closed Line 4 station. She closed it on her own. She doesn't know what she did. Last night she went back to it. Zaytoona's bats saw her. She will.", "title_page": false}, {"n": 21, "src": "pages/c8/21.webp", "thumb": "pages/c8/21_t.webp", "alt": "", "title_page": false}, {"n": 22, "src": "pages/c8/22.webp", "thumb": "pages/c8/22_t.webp", "alt": "", "title_page": false}], "spreads": [], "cover": "pages/c8/01.webp", "thumb": "pages/c8/01_t.webp"}, {"n": 9, "name": "Chapter 9: City Duty", "pages": [{"n": 1, "src": "pages/c9/01.webp", "thumb": "pages/c9/01_t.webp", "alt": "At first, the world called it a miracle. Then it called it a problem. Then it called it an opportunity. The world moved on. The children didn't.", "title_page": false}, {"n": 2, "src": "pages/c9/02.webp", "thumb": "pages/c9/02_t.webp", "alt": "Zeyno. Neighbours brought their children to watch her. She was the street's little miracle. Then, one night, a fire.", "title_page": false}, {"n": 3, "src": "pages/c9/03.webp", "thumb": "pages/c9/03_t.webp", "alt": "Nobody saw how it started. Everyone decided they knew. A week later, a letter: she was to be registered, tested and watched. Her family left in the night rather than hand her over. She learned to keep her fire hidden. The world stopped calling her a miracle. Vesper never did.", "title_page": false}, {"n": 4, "src": "pages/c9/04.webp", "thumb": "pages/c9/04_t.webp", "alt": "", "title_page": false}, {"n": 5, "src": "pages/c9/05.webp", "thumb": "pages/c9/05_t.webp", "alt": "Azelax. The day his power woke, the whole street flooded.", "title_page": false}, {"n": 6, "src": "pages/c9/06.webp", "thumb": "pages/c9/06_t.webp", "alt": "So he made it smaller. A little more every day, until small was all he had. Without meaning to, he locked the rest away. Even he forgot it was there.", "title_page": false}, {"n": 7, "src": "pages/c9/07.webp", "thumb": "pages/c9/07_t.webp", "alt": "Jeon. The government tested her. She came first.", "title_page": false}, {"n": 8, "src": "pages/c9/08.webp", "thumb": "pages/c9/08_t.webp", "alt": "Helping him counted against her. Years later, he ran. She stayed. It taught her she would never need anyone.", "title_page": false}, {"n": 9, "src": "pages/c9/09.webp", "thumb": "pages/c9/09_t.webp", "alt": "Zeyno. Vesper. Azelax. Ranked 19th. Jeon. Ranked first.", "title_page": false}, {"n": 10, "src": "pages/c9/10.webp", "thumb": "pages/c9/10_t.webp", "alt": "VOLUME 2 SECRET LAIR Absolute Zero · Chapter 9: City Duty", "title_page": true}, {"n": 11, "src": "pages/c9/11.webp", "thumb": "pages/c9/11_t.webp", "alt": "Monday. City duty. Vesper's out every night now. From today you're not trainees in the city. You're the Corps. We get patches! We get patches.", "title_page": false}, {"n": 12, "src": "pages/c9/12.webp", "thumb": "pages/c9/12_t.webp", "alt": "Squads of three. North-east blocks: Jeon, Azelax, Anna. I don't need backup. You've got it anyway.", "title_page": false}, {"n": 13, "src": "pages/c9/13.webp", "thumb": "pages/c9/13_t.webp", "alt": "They're real. Don't tell anyone. Corps Shifted. Don't stare.", "title_page": false}, {"n": 14, "src": "pages/c9/14.webp", "thumb": "pages/c9/14_t.webp", "alt": "Gas leak, bakery on Fenn Street. That's you.", "title_page": false}, {"n": 15, "src": "pages/c9/15.webp", "thumb": "pages/c9/15_t.webp", "alt": "You froze it. Just like that. Thank you. You're welcome. Fix the pipe. Nice save. What save?", "title_page": false}, {"n": 16, "src": "pages/c9/16.webp", "thumb": "pages/c9/16_t.webp", "alt": "Tram stuck on Holt Bridge, power's out. Keep the passengers calm till the engineers get there. Cable's burnt through. The engineers say twenty minutes. That's nineteen too many. My wife used to say I panic like a goldfish. Goldfish are very calm. I've checked.", "title_page": false}, {"n": 17, "src": "pages/c9/17.webp", "thumb": "pages/c9/17_t.webp", "alt": "Kid's power's gone off at Larch Street Primary. Nobody hurt yet. I'll freeze the floor round her. She can't hurt anyone if nothing moves.", "title_page": false}, {"n": 18, "src": "pages/c9/18.webp", "thumb": "pages/c9/18_t.webp", "alt": "Wait. Look. Just this. Watch it with me. That's it. Small is fine.", "title_page": false}, {"n": 19, "src": "pages/c9/19.webp", "thumb": "pages/c9/19_t.webp", "alt": "Thank God. So she's not a problem, then? ...A problem. A drop. That's all he did.", "title_page": false}, {"n": 20, "src": "pages/c9/20.webp", "thumb": "pages/c9/20_t.webp", "alt": "Ten of hearts. Hold still. Encore? She likes you. Market's clear. Clean week so far, sir.", "title_page": false}, {"n": 21, "src": "pages/c9/21.webp", "thumb": "pages/c9/21_t.webp", "alt": "Sharoz. Vivi. Rescues are the best part. You okay? Vivi. Where do you want the scaffold?", "title_page": false}, {"n": 22, "src": "pages/c9/22.webp", "thumb": "pages/c9/22_t.webp", "alt": "You can sit, you know. Nobody's ranking lunch. Somebody's always ranking something.", "title_page": false}, {"n": 23, "src": "pages/c9/23.webp", "thumb": "pages/c9/23_t.webp", "alt": "Every call answered, nobody hurt. Not bad, for children. Depot on Kessler Road. Vesper. They're burning the vans.", "title_page": false}, {"n": 24, "src": "pages/c9/24.webp", "thumb": "pages/c9/24_t.webp", "alt": "Corps! You're late. Wall! Left!", "title_page": false}, {"n": 25, "src": "pages/c9/25.webp", "thumb": "pages/c9/25_t.webp", "alt": "Ice girl! Cute trick.", "title_page": false}, {"n": 26, "src": "pages/c9/26.webp", "thumb": "pages/c9/26_t.webp", "alt": "I had him. You saved four vans. Registration files. They were burning the names.", "title_page": false}, {"n": 27, "src": "pages/c9/27.webp", "thumb": "pages/c9/27_t.webp", "alt": "Under the closed Line 4 station. The ice girl from the programme. Jeon. She held the whole gate. I couldn't get through. Ice melts.", "title_page": false}, {"n": 28, "src": "pages/c9/28.webp", "thumb": "pages/c9/28_t.webp", "alt": "She's never needed anyone. That's what they made her for. The van's ash. And the ice girl's real. She's good. Good. Tomorrow night, the north side.", "title_page": false}, {"n": 29, "src": "pages/c9/29.webp", "thumb": "pages/c9/29_t.webp", "alt": "", "title_page": false}, {"n": 30, "src": "pages/c9/30.webp", "thumb": "pages/c9/30_t.webp", "alt": "Next morning. The Wardens sent to guard the north side come back. Vesper did this? How many of them? One. Red. She was all in red.", "title_page": false}, {"n": 31, "src": "pages/c9/31.webp", "thumb": "pages/c9/31_t.webp", "alt": "Then I'll find her first.", "title_page": false}], "spreads": [], "cover": "pages/c9/10.webp", "thumb": "pages/c9/10_t.webp"}, {"n": 10, "name": "Chapter 10: Flood Season", "pages": [{"n": 1, "src": "pages/c10/01.webp", "thumb": "pages/c10/01_t.webp", "alt": "CHAPTER 10 FLOOD SEASON", "title_page": true}, {"n": 2, "src": "pages/c10/02.webp", "thumb": "pages/c10/02_t.webp", "alt": "Three days of rain. On the fourth night, the river came over the wall. Every squad out. The low city's under. How deep? Deep enough.", "title_page": false}, {"n": 3, "src": "pages/c10/03.webp", "thumb": "pages/c10/03_t.webp", "alt": "Cas, Shibby: Dock Road underpass, there's a bus in it. Vivi, Sharoz: Tanner's Yard, people on the roofs. Jeon, Azelax, Anna: Mercer Row. Get everyone out. Mercer Row. I grew up on Mercer Row.", "title_page": false}, {"n": 4, "src": "pages/c10/04.webp", "thumb": "pages/c10/04_t.webp", "alt": "Drain's blocked. Give me one chord. Rope's up. Ladies first. Gentlemen also first.", "title_page": false}, {"n": 5, "src": "pages/c10/05.webp", "thumb": "pages/c10/05_t.webp", "alt": "Tanner's Yard. Go. I've got it. Hold on to each other, not the feathers! Are you getting this? She's carrying the whole street.", "title_page": false}, {"n": 6, "src": "pages/c10/06.webp", "thumb": "pages/c10/06_t.webp", "alt": "Anyone who can't walk, wave! I'll come to you! Ice path. Single file. Don't run.", "title_page": false}, {"n": 7, "src": "pages/c10/07.webp", "thumb": "pages/c10/07_t.webp", "alt": "Take your time. It won't come in. You're the boy from number nine. That's the one who flooded this street.", "title_page": false}, {"n": 8, "src": "pages/c10/08.webp", "thumb": "pages/c10/08_t.webp", "alt": "Mercer Row! The river wall's gone! Get out of the street! My foot's caught! Anna! Get them up!", "title_page": false}, {"n": 9, "src": "pages/c10/09.webp", "thumb": "pages/c10/09_t.webp", "alt": "More. I need more. Come on. Why won't it come?", "title_page": false}, {"n": 10, "src": "pages/c10/10.webp", "thumb": "pages/c10/10_t.webp", "alt": "The whole street moved. Just for a second. No!", "title_page": false}, {"n": 11, "src": "pages/c10/11.webp", "thumb": "pages/c10/11_t.webp", "alt": "Breathe. You're out. I've got her. Go.", "title_page": false}, {"n": 12, "src": "pages/c10/12.webp", "thumb": "pages/c10/12_t.webp", "alt": "Mercer Row? Everyone out. Everyone alive. I wasn't scared. I tried. That's all there is.", "title_page": false}, {"n": 13, "src": "pages/c10/13.webp", "thumb": "pages/c10/13_t.webp", "alt": "I saw it. The whole street moved when you pushed. I gave it everything. That was all of it. No. That's all you let yourself have.", "title_page": false}, {"n": 14, "src": "pages/c10/14.webp", "thumb": "pages/c10/14_t.webp", "alt": "Jeon. He held that street on his own till you got there. What good is power if you're too weak to wield it?", "title_page": false}, {"n": 15, "src": "pages/c10/15.webp", "thumb": "pages/c10/15_t.webp", "alt": "Jeon's wrong. There's nothing more in there. ...Is there?", "title_page": false}, {"n": 16, "src": "pages/c10/16.webp", "thumb": "pages/c10/16_t.webp", "alt": "...forty-one people off the rooftops of Tanner's Yard. A Corps trainee they're already calling the Feather. Forty-one. I had one bus. We had one bus. Sharoz lifted a wall off a car with a family in it. Nobody films a wall.", "title_page": false}, {"n": 17, "src": "pages/c10/17.webp", "thumb": "pages/c10/17_t.webp", "alt": "New rankings. Vivi: fourteenth to fourth. Fourth. In one night. Azelax: nineteenth.", "title_page": false}, {"n": 18, "src": "pages/c10/18.webp", "thumb": "pages/c10/18_t.webp", "alt": "Too weak to wield it.", "title_page": false}], "spreads": [], "cover": "pages/c10/01.webp", "thumb": "pages/c10/01_t.webp"}], "cover": "covers/v1.webp?v=32167814"};

    } else render();
  }
  const next = () => { const v = viewFor(page); if (!v.end) go(last(v) + 1); };
  const prev = () => { const v = viewFor(page); const a = first(v); if (a > 1) go(first(viewFor(a - 1))); };

  function buildScroll() {
    const s = $("scroll");
    if (s.childElementCount) return;
    CH.pages.forEach((p) => {
      const sp = spreadFor(p.n);
      if (sp && p.n !== sp.pages[0]) return;           // second half is already in the spread image
      let im;
      if (sp) {
        im = new Image(); im.src = sp.src; im.loading = "lazy"; im.className = "wide";
        im.alt = "Pages " + sp.pages.join(" and "); im.width = 3200; im.height = 2400;
      } else im = img(p.n, p.n <= 2);
      im.dataset.p = p.n; s.appendChild(im);
    });
    s.appendChild(endCard());
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (e.isIntersecting) {
          page = +e.target.dataset.p;
          const sp = spreadFor(page);
          $("counter").textContent = (sp ? sp.pages.join("–") : page) + " / " + N;
          $("slider").value = page;
          remember(page);
        }
      });
    }, { root: s, threshold: 0.35 });
    s.querySelectorAll("img").forEach((im) => io.observe(im));
  }

  function setMode(m) {
    mode = m;
    store.set("mode", m);
    document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
    const scroll = m === "scroll";
    $("stage").classList.toggle("hidden", scroll);
    $("scroll").classList.toggle("hidden", !scroll);
    $("prevBtn").classList.toggle("hidden", scroll);
    $("nextBtn").classList.toggle("hidden", scroll);
    if (scroll) { buildScroll(); requestAnimationFrame(() => go(page)); }
    else { page = Math.min(page, N); render(); }
  }

  // ---- screens: home (volumes) → a volume (landing) → reader; or a coming-soon poster ----
  const SCREENS = ["home", "soon", "landing", "reader"];
  function show(id) {
    SCREENS.forEach((s) => $(s).classList.toggle("hidden", s !== id));
    if (id !== "reader") scrollTo(0, 0);
  }
  function showHome() {
    show("home");
    history.replaceState(null, "", location.pathname);
  }
  function showVolume(n) {
    const v = VOLUMES.find((x) => x.n === n) || volOf(CH.n);
    if (!v || v.soon) return v ? showSoon(v.n) : showHome();
    VOL = v;
    $("coverImg").src = v.poster;
    $("coverImg").alt = v.alt || "";
    $("landTitle").textContent = v.title;
    $("landVol").textContent = "Secret Lair · Volume " + v.n;
    show("landing");
    history.replaceState(null, "", "#v" + v.n);
    showResume();
  }
  function showSoon(n) {
    const v = VOLUMES.find((x) => x.n === n);
    if (!v) return showHome();
    $("soonImg").src = v.poster;
    $("soonImg").alt = "The Volume " + v.n + " teaser poster";
    $("soonKicker").textContent = "Secret Lair · Volume " + v.n;
    $("soonTitle").textContent = v.title;
    $("soonBlurb").textContent = v.blurb;
    show("soon");
    history.replaceState(null, "", "#v" + v.n);
  }
  function buildHome() {
    const list = $("vols");
    VOLUMES.forEach((v) => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.className = "volcard" + (v.soon ? " soon" : "");
      b.innerHTML = '<div class="poster"><img alt=""><span class="badge"></span></div>' +
        '<div class="meta"><small></small><b class="display"></b><span></span></div>';
      b.querySelector("img").src = v.card;
      b.querySelector("img").alt = "Volume " + v.n + " poster";
      const badge = b.querySelector(".badge");
      badge.textContent = v.soon ? "Coming soon" : "Read now";
      if (!v.soon) badge.classList.add("out");
      b.querySelector("small").textContent = "Volume " + v.n;
      b.querySelector("b").textContent = v.title;
      const have = v.chapters.length, part = have < v.planned;
      if (!v.soon && part) badge.textContent = "New chapters";
      b.querySelector(".meta span").textContent = v.soon ? v.blurb :
        (part ? have + " of " + v.planned + " chapters out" : have + " chapters") + " · " + v.blurb;
      b.onclick = () => (v.soon ? showSoon(v.n) : showVolume(v.n));
      li.appendChild(b); list.appendChild(li);
    });
  }

  function open(c, n) {
    setChapter(c);
    show("reader");
    $("scroll").scrollTop = 0;
    page = Math.max(1, Math.min(N, n));
    setMode(mode);
    const h = $("hint");
    if (mode !== "scroll" && !store.get("hinted")) {
      h.style.opacity = 1; setTimeout(() => (h.style.opacity = 0), 3500); store.set("hinted", "1");
    } else h.style.opacity = 0;
  }
  const home = () => showVolume(volOf(CH.n).n);   // the reader's back button returns to the volume

  // The thumbnail grid doubles as the chapter menu: one tab per chapter.
  let gridCh = 1;
  function fillGrid(c) {
    gridCh = c;
    const ch = chapter(c), t = $("thumbs");
    t.innerHTML = "";
    ch.pages.forEach((p) => {
      const b = document.createElement("button");
      b.dataset.p = p.n;
      b.innerHTML = '<img loading="lazy" alt="" src="' + p.thumb + '">' + p.n;
      b.classList.toggle("current", ch === CH && p.n === Math.min(page, N));
      b.onclick = () => { closeGrid(); if (ch === CH) go(p.n); else open(ch.n, p.n); };
      t.appendChild(b);
    });
    const inVol = volChapters(volOf(c)).map((x) => x.n);
    $("tabs").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", +b.dataset.c === c);
      b.classList.toggle("hidden", !inVol.includes(+b.dataset.c));
    });
    $("tabs").classList.toggle("hidden", inVol.length < 2);
    $("gridTitle").textContent = inVol.length > 1 ? "Chapters" : "All pages";
  }
  function openGrid() { fillGrid(CH.n); $("grid").classList.remove("hidden"); }
  const closeGrid = () => $("grid").classList.add("hidden");

  // ---- landing ----
  function showResume() {
    const mine = volChapters(VOL);
    const r = $("resumeBtn");
    r.classList.add("hidden");
    const last = +store.get("chapter") || mine[0].n;
    const c = mine.find((x) => x.n === last);
    const saved = c ? +store.get(pageKey(c.n)) : 0;
    if (c && (saved > 1 || c.n !== mine[0].n) && saved <= c.pages.length) {
      r.textContent = "Continue " + (mine.length > 1 ? "Chapter " + c.n + ", " : "from ") + "page " + Math.max(saved, 1);
      r.onclick = () => open(c.n, Math.max(saved, 1)); r.classList.remove("hidden");
    }
    $("chName").textContent = mine.length === 1 ? mine[0].name : "";
    $("chName").classList.toggle("hidden", mine.length !== 1);
    const list = $("chapList");
    list.innerHTML = "";
    list.classList.add("hidden");
    if (mine.length > 1) {
      mine.forEach((ch) => {
        const li = document.createElement("li"), b = document.createElement("button");
        const at = +store.get(pageKey(ch.n));
        b.innerHTML = '<img alt="" src="' + ch.thumb + '"><span><b></b><small></small></span>';
        b.querySelector("b").textContent = ch.name;
        b.querySelector("small").textContent = ch.pages.length + " pages" + (at > 1 ? " · read to page " + at : "");
        b.onclick = () => open(ch.n, 1);
        li.appendChild(b); list.appendChild(li);
      });
      list.classList.remove("hidden");
    }
  }

  if (CHAPTERS.length > 1) {
    CHAPTERS.forEach((ch) => {
      const b = document.createElement("button");
      b.dataset.c = ch.n; b.textContent = ch.name;
      b.onclick = () => fillGrid(ch.n);
      $("tabs").appendChild(b);
    });
    $("tabs").classList.remove("hidden");
  }

  // ---- wiring ----
  $("startBtn").onclick = () => open(volChapters(VOL)[0].n, 1);
  $("homeBtn").onclick = home;
  $("prevBtn").onclick = prev;
  $("nextBtn").onclick = next;
  $("hitL").onclick = prev;
  $("hitR").onclick = next;
  $("slider").oninput = (e) => go(+e.target.value);
  $("gridBtn").onclick = openGrid;
  $("barTitle").onclick = openGrid;
  $("gridClose").onclick = closeGrid;
  document.querySelectorAll(".modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  $("fsBtn").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  // double-click the page to hide the bars for an uncluttered read
  $("stage").addEventListener("dblclick", () => $("reader").classList.toggle("immersive"));

  document.addEventListener("keydown", (e) => {
    if ($("reader").classList.contains("hidden")) {
      const onLanding = !$("landing").classList.contains("hidden");
      if (onLanding && e.key === "Enter" && e.target.tagName !== "BUTTON") open(volChapters(VOL)[0].n, 1);
      if (e.key === "Escape" && $("home").classList.contains("hidden")) showHome();
      return;
    }
    if (!$("grid").classList.contains("hidden")) { if (e.key === "Escape") closeGrid(); return; }
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (mode !== "scroll" && ["arrowright", "d", " ", "pagedown"].includes(k)) { e.preventDefault(); next(); }
    else if (mode !== "scroll" && ["arrowleft", "a", "pageup"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "home") go(1);
    else if (k === "end") go(N);
    else if (k === "g") openGrid();
    else if (k === "f") $("fsBtn").click();
    else if (k === "h") $("reader").classList.toggle("immersive");
    else if (k === "escape") home();
  });

  // swipe to turn pages (single and spread modes)
  let sx = null, sy = 0;
  $("stage").addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null;
  }, { passive: true });
  $("stage").addEventListener("touchend", (e) => {
    if (sx === null || (window.visualViewport && visualViewport.scale > 1.01)) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? next : prev)();
    sx = null;
  });

  addEventListener("resize", () => { if (mode !== "scroll" && !$("reader").classList.contains("hidden")) render(); });

  $("landBack").onclick = showHome;
  $("soonBack").onclick = showHome;
  buildHome();

  // #p5 is Chapter 1 page 5 (the links shared before chapters); #c2p5 is Chapter 2 page 5;
  // #vN is a volume's chapter list (or its coming-soon poster); no hash is the volume picker.
  function route() {
    const m = location.hash.match(/^#(?:c(\d+))?p(\d+)$/);
    const v = location.hash.match(/^#v(\d+)$/);
    if (m) open(m[1] ? +m[1] : 1, +m[2]);
    else if (v) showVolume(+v[1]);
    else showHome();
  }
  route();
  addEventListener("hashchange", route);
})();
</script>
</body>
</html>
