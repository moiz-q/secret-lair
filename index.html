<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Lair · Chapter 1</title>
<meta name="description" content="Secret Lair, Volume 1: Field of Thorns. Chapter 1: Roots.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e10">
<meta property="og:type" content="website">
<meta property="og:title" content="Secret Lair · Chapter 1: Roots">
<meta property="og:description" content="Volume 1: Field of Thorns">
<meta property="og:image" content="https://moiz-q.github.io/secret-lair/cover.jpg">
<meta property="og:url" content="https://moiz-q.github.io/secret-lair/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --bg: #0e0e10; --bar: rgba(14,14,16,.92); --text: #ecebe6; --muted: #9a9890;
  --line: #2a2a2e; --accent: #c8423f; --chip: #1c1c20;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- landing ---------- */
#landing { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.land { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 380px); gap: 48px; align-items: center; max-width: 820px; }
.land img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.land h1 { font-size: clamp(40px, 7vw, 64px); line-height: .95; letter-spacing: .02em; margin: 0 0 12px;
  text-transform: uppercase; font-weight: 800; }
.land .vol { color: var(--muted); margin: 0 0 2px; }
.land .ch { margin: 0 0 28px; font-weight: 600; }
.cta { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 11px 20px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn:focus-visible, .icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (max-width: 700px) {
  .land { grid-template-columns: 1fr; gap: 24px; text-align: center; }
  .land img { max-width: 260px; margin: 0 auto; }
  .cta { justify-content: center; }
}

/* ---------- reader ---------- */
#reader { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--bar); border-bottom: 1px solid var(--line); z-index: 3; transition: transform .25s, opacity .25s; }
.bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.bar .title { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; margin-right: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.icon { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: var(--text); }
.icon:hover { background: var(--chip); }
.icon svg { width: 20px; height: 20px; }
.modes { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; margin: 0 6px; }
.modes button { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: #33333a; color: var(--text); }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 64px; text-align: center; }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 80px; }
#reader.immersive .bar.top { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar.bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar { position: absolute; left: 0; right: 0; }
#reader.immersive .bar.top { top: 0; } #reader.immersive .bar.bottom { bottom: 0; }

.stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 10px; user-select: none; touch-action: pan-y pinch-zoom; }
.stage .spread { display: flex; height: 100%; max-width: 100%; align-items: center; justify-content: center; gap: 0; }
.stage img { display: block; max-height: 100%; max-width: 100%; height: auto; width: auto; object-fit: contain;
  background: #1a1a1d; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.stage .spread.two img { max-width: 50%; }
.stage .spread.wide img { max-width: 100%; }
.hit { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 2; }
.hit.l { left: 0; cursor: w-resize; } .hit.r { right: 0; cursor: e-resize; }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 0 40px; }
.scroll img { display: block; width: min(100%, 900px); height: auto; margin: 0 auto 14px; aspect-ratio: 2/3; background: #1a1a1d; }
.scroll .endcard { margin: 30px auto; }

/* ---------- thumbnails ---------- */
#grid { position: fixed; inset: 0; background: rgba(8,8,10,.97); z-index: 5; overflow-y: auto; padding: 16px; }
#grid header { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto 14px; }
#grid h2 { margin: 0; font-size: 16px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.thumbs button { text-align: center; color: var(--muted); font-size: 12px; }
.thumbs img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 3px; border: 2px solid transparent; display: block; margin-bottom: 4px; }
.thumbs button.current img { border-color: var(--accent); }

/* ---------- end card ---------- */
.endcard { max-width: 420px; text-align: center; padding: 32px 20px; }
.endcard h2 { text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
.endcard p { color: var(--muted); margin: 0 0 22px; }

.hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75);
  color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; pointer-events: none;
  transition: opacity .6s; z-index: 4; white-space: nowrap; }
@media (max-width: 640px) {
  .bar .title span, .hide-sm { display: none; }
  .modes button { padding: 6px 8px; }
}
</style>
</head>
<body>

<section id="landing">
  <div class="land">
    <img id="coverImg" alt="The title page: the old harbour's dead cranes at dawn">
    <div>
      <h1>Secret<br>Lair</h1>
      <p class="vol">Volume 1: Field of Thorns</p>
      <p class="ch">Chapter 1: Roots</p>
      <div class="cta">
        <button class="btn" id="startBtn">Start reading</button>
        <button class="btn ghost hidden" id="resumeBtn"></button>
      </div>
    </div>
  </div>
</section>

<section id="reader" class="hidden" aria-label="Comic reader">
  <div class="bar top">
    <button class="icon" id="homeBtn" aria-label="Back to cover" title="Cover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title">Secret Lair<span>Chapter 1: Roots</span></div>
    <div class="modes" role="group" aria-label="Reading mode">
      <button data-mode="single" aria-pressed="false" title="One page at a time">Page</button>
      <button data-mode="double" aria-pressed="false" title="Two-page spreads">Spread</button>
      <button data-mode="scroll" aria-pressed="false" title="Scroll down through every page">Scroll</button>
    </div>
    <button class="icon" id="gridBtn" aria-label="All pages" title="All pages (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
    <button class="icon hide-sm" id="fsBtn" aria-label="Full screen" title="Full screen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="spread" id="spread"></div>
    <button class="hit l" id="hitL" aria-label="Previous page"></button>
    <button class="hit r" id="hitR" aria-label="Next page"></button>
    <div class="hint" id="hint">Tap the sides or use ← → to turn pages</div>
  </div>
  <div class="scroll hidden" id="scroll"></div>

  <div class="bar bottom" id="bottomBar">
    <button class="icon" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <input type="range" id="slider" min="1" value="1" aria-label="Page">
    <span class="counter" id="counter"></span>
    <button class="icon" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<section id="grid" class="hidden" aria-label="All pages">
  <header><h2>All pages</h2>
    <button class="icon" id="gridClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></header>
  <div class="thumbs" id="thumbs"></div>
</section>

<script>
const BOOK = {"title": "Secret Lair", "volume": "Volume 1: Field of Thorns", "chapter": "Chapter 1: Roots", "pages": [{"n": 1, "src": "pages/01.webp", "thumb": "pages/01_t.webp", "alt": "Twenty-three years ago, the sky went white for nine seconds. No one could explain it. By morning, most people had stopped trying."}, {"n": 2, "src": "pages/02.webp", "thumb": "pages/02_t.webp", "alt": "Nine months later, the first children were born different."}, {"n": 3, "src": "pages/03.webp", "thumb": "pages/03_t.webp", "alt": "They called it the Shift. The children were Shifted. Everyone else got a word they'd never needed before. Constant."}, {"n": 4, "src": "pages/04.webp", "thumb": "pages/04_t.webp", "alt": "At first, the world called it a miracle. Then it called it a problem. Then it called it an opportunity. 1147"}, {"n": 5, "src": "pages/05.webp", "thumb": "pages/05_t.webp", "alt": "Some of the Shifted decided they didn't need anyone's permission. They came at dusk. People started calling them Vesper."}, {"n": 6, "src": "pages/06.webp", "thumb": "pages/06_t.webp", "alt": "Fifteen years ago, Vesper came to Asheford. Stay with me. Hey. Stay with me. The city survived. Not everyone came out whole."}, {"n": 7, "src": "pages/07.webp", "thumb": "pages/07_t.webp", "alt": ""}, {"n": 8, "src": "pages/08.webp", "thumb": "pages/08_t.webp", "alt": "FIFTEEN YEARS LATER SECRET LAIR Field of Thorns · Chapter 1: Roots"}, {"n": 9, "src": "pages/09.webp", "thumb": "pages/09_t.webp", "alt": ""}, {"n": 10, "src": "pages/10.webp", "thumb": "pages/10_t.webp", "alt": "You'll open it for us."}, {"n": 11, "src": "pages/11.webp", "thumb": "pages/11_t.webp", "alt": ""}, {"n": 12, "src": "pages/12.webp", "thumb": "pages/12_t.webp", "alt": "Intake Thirty-One. Forty of us. They say it's the best year the Corps has had in a decade."}, {"n": 13, "src": "pages/13.webp", "thumb": "pages/13_t.webp", "alt": "Every month, they post the rankings. Mum: Happy birthday, love. 22!! x 34 · 35 · 36 ROKA · 37 I'm thirty-sixth."}, {"n": 14, "src": "pages/14.webp", "thumb": "pages/14_t.webp", "alt": "You look like you slept in a hedge. Thanks. You've got a follower. He's been with me since the bakery. I keep telling him I can't afford him. Assessment today. I know. Mattyes is grading. I know."}, {"n": 15, "src": "pages/15.webp", "thumb": "pages/15_t.webp", "alt": "Did you sleep here? No. Is it still pulling? Drifted right under load. Fixed it. Mostly."}, {"n": 16, "src": "pages/16.webp", "thumb": "pages/16_t.webp", "alt": "Twelve civilians. Six hostiles. Drones are hostiles. Dummies are civilians. Try not to mix them up. Vest goes red, you're out. First group. Go."}, {"n": 17, "src": "pages/17.webp", "thumb": "pages/17_t.webp", "alt": "Eleven seconds. Didn't even touch the dummies."}, {"n": 18, "src": "pages/18.webp", "thumb": "pages/18_t.webp", "alt": "Good reflexes. Good night vision. Next. Next group."}, {"n": 19, "src": "pages/19.webp", "thumb": "pages/19_t.webp", "alt": "Roka. Out."}, {"n": 20, "src": "pages/20.webp", "thumb": "pages/20_t.webp", "alt": "Support track? Plants. Good for search and rescue. …Maybe."}, {"n": 21, "src": "pages/21.webp", "thumb": "pages/21_t.webp", "alt": "You know what my file says? \"Good reflexes. Good night vision.\" That's it. That's the whole entry. And the cats. And every cat in the city thinks I'm their mum. They left that bit out. Everyone else's power is an answer."}, {"n": 22, "src": "pages/22.webp", "thumb": "pages/22_t.webp", "alt": "Mine's a garden. I didn't get one at all. Built the first one of these out of scrap when I was fourteen. Weighed a ton. Caught fire twice."}, {"n": 23, "src": "pages/23.webp", "thumb": "pages/23_t.webp", "alt": "Your power isn't the problem. Nobody's shown you what it's for yet. Hey. You weren't eating it."}, {"n": 24, "src": "pages/24.webp", "thumb": "pages/24_t.webp", "alt": "Next week's field exercise. Search and rescue. Old harbour district. Inside the fence? Inside the fence. First Intake that's ever been let in."}, {"n": 25, "src": "pages/25.webp", "thumb": "pages/25_t.webp", "alt": "Teams go up tonight. Dismissed."}, {"n": 26, "src": "pages/26.webp", "thumb": "pages/26_t.webp", "alt": "Leena: you thought we forgot didn't you Leena: check your bag Moiz: Happy 22nd, Roka. Same roof next year."}, {"n": 27, "src": "pages/27.webp", "thumb": "pages/27_t.webp", "alt": "…They're all facing the same way. The harbour."}, {"n": 28, "src": "pages/28.webp", "thumb": "pages/28_t.webp", "alt": "Fifteen years."}], "spreads": [{"pages": [6, 7], "src": "pages/06-07.webp"}], "cover": "pages/08.webp"};
(function () {
  const $ = (id) => document.getElementById(id);
  const N = BOOK.pages.length;
  const END = N + 1;                       // a virtual "end of chapter" view
  const store = {
    get(k) { try { return localStorage.getItem("secretlair-" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("secretlair-" + k, v); } catch (e) {} }
  };
  const spreadFor = (n) => BOOK.spreads.find((s) => s.pages.includes(n));
  const wideScreen = () => innerWidth >= 1000 && innerWidth / innerHeight > 1.15;

  let page = 1;
  let mode = store.get("mode") || (innerWidth < 700 ? "scroll" : wideScreen() ? "double" : "single");

  // Which pages are shown together for a given page, in the current mode.
  function viewFor(n) {
    if (n >= END) return { end: true };
    const s = spreadFor(n);
    if (mode === "double") {
      if (s) return { spread: s };
      if (n === 1) return { pages: [1] };                     // page 1 sits alone, like a book's first right-hand page
      const left = n % 2 === 0 ? n : n - 1;                   // even pages on the left
      return { pages: [left, left + 1].filter((p) => p <= N) };
    }
    return { pages: [n] };
  }
  const first = (v) => v.end ? END : v.spread ? v.spread.pages[0] : v.pages[0];
  const last = (v) => v.end ? END : v.spread ? v.spread.pages[1] : v.pages[v.pages.length - 1];

  function img(p, eager) {
    const im = new Image();
    im.src = BOOK.pages[p - 1].src;
    im.alt = "Page " + p + (BOOK.pages[p - 1].alt ? ": " + BOOK.pages[p - 1].alt : "");
    im.decoding = "async";
    if (!eager) im.loading = "lazy";
    im.width = 1600; im.height = 2400;
    return im;
  }

  function endCard() {
    const d = document.createElement("div");
    d.className = "endcard";
    d.innerHTML = "<h2>End of Chapter 1</h2><p>Secret Lair · Volume 1: Field of Thorns</p>";
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = "Read again from the start";
    b.onclick = () => go(1);
    d.appendChild(b);
    return d;
  }

  function render() {
    const v = viewFor(page);
    const box = $("spread");
    box.innerHTML = "";
    box.className = "spread";
    if (v.end) {
      box.appendChild(endCard());
    } else if (v.spread) {
      box.classList.add("wide");
      const im = new Image();
      im.src = v.spread.src; im.alt = "Pages " + v.spread.pages.join(" and ");
      box.appendChild(im);
    } else {
      if (v.pages.length === 2) box.classList.add("two");
      v.pages.forEach((p) => box.appendChild(img(p, true)));
    }
    const a = first(v), b = last(v);
    $("counter").textContent = v.end ? "End" : a === b ? a + " / " + N : a + "–" + b + " / " + N;
    $("slider").value = Math.min(a, N);
    $("prevBtn").disabled = a <= 1;
    $("nextBtn").disabled = v.end;
    history.replaceState(null, "", "#p" + Math.min(a, N));
    store.set("page", String(Math.min(a, N)));
    // warm the cache for the next and previous views
    [last(v) + 1, last(v) + 2, a - 1].forEach((p) => { if (p >= 1 && p <= N) new Image().src = BOOK.pages[p - 1].src; });
  }

  function go(n) {
    page = Math.max(1, Math.min(END, n));
    if (mode === "scroll") {
      const t = document.querySelector('#scroll [data-p="' + Math.min(page, N) + '"]');
      if (t) t.scrollIntoView();
    } else render();
  }
  const next = () => { const v = viewFor(page); if (!v.end) go(last(v) + 1); };
  const prev = () => { const v = viewFor(page); const a = first(v); if (a > 1) go(first(viewFor(a - 1))); };

  function buildScroll() {
    const s = $("scroll");
    if (s.childElementCount) return;
    BOOK.pages.forEach((p) => { const im = img(p.n, p.n <= 2); im.dataset.p = p.n; s.appendChild(im); });
    s.appendChild(endCard());
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (e.isIntersecting) {
          page = +e.target.dataset.p;
          $("counter").textContent = page + " / " + N;
          $("slider").value = page;
          history.replaceState(null, "", "#p" + page);
          store.set("page", String(page));
        }
      });
    }, { root: s, threshold: 0.35 });
    s.querySelectorAll("img").forEach((im) => io.observe(im));
  }

  function setMode(m) {
    mode = m;
    store.set("mode", m);
    document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
    const scroll = m === "scroll";
    $("stage").classList.toggle("hidden", scroll);
    $("scroll").classList.toggle("hidden", !scroll);
    $("prevBtn").classList.toggle("hidden", scroll);
    $("nextBtn").classList.toggle("hidden", scroll);
    if (scroll) { buildScroll(); requestAnimationFrame(() => go(page)); }
    else { page = Math.min(page, N); render(); }
  }

  function open(n) {
    $("landing").classList.add("hidden");
    $("reader").classList.remove("hidden");
    page = n;
    setMode(mode);
    const h = $("hint");
    if (mode !== "scroll" && !store.get("hinted")) {
      h.style.opacity = 1; setTimeout(() => (h.style.opacity = 0), 3500); store.set("hinted", "1");
    } else h.style.opacity = 0;
  }
  function home() {
    $("reader").classList.add("hidden");
    $("landing").classList.remove("hidden");
    history.replaceState(null, "", location.pathname);
    showResume();
  }

  function openGrid() {
    const t = $("thumbs");
    if (!t.childElementCount) {
      BOOK.pages.forEach((p) => {
        const b = document.createElement("button");
        b.dataset.p = p.n;
        b.innerHTML = '<img loading="lazy" alt="" src="' + p.thumb + '">' + p.n;
        b.onclick = () => { closeGrid(); go(p.n); };
        t.appendChild(b);
      });
    }
    t.querySelectorAll("button").forEach((b) => b.classList.toggle("current", +b.dataset.p === Math.min(page, N)));
    $("grid").classList.remove("hidden");
  }
  const closeGrid = () => $("grid").classList.add("hidden");

  // ---- wiring ----
  $("coverImg").src = BOOK.cover;
  $("slider").max = N;
  $("startBtn").onclick = () => open(1);
  function showResume() {
    const saved = +store.get("page");
    const r = $("resumeBtn");
    if (saved > 1 && saved <= N) { r.textContent = "Continue from page " + saved; r.onclick = () => open(saved); r.classList.remove("hidden"); }
  }
  showResume();
  $("homeBtn").onclick = home;
  $("prevBtn").onclick = prev;
  $("nextBtn").onclick = next;
  $("hitL").onclick = prev;
  $("hitR").onclick = next;
  $("slider").oninput = (e) => go(+e.target.value);
  $("gridBtn").onclick = openGrid;
  $("gridClose").onclick = closeGrid;
  document.querySelectorAll(".modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  $("fsBtn").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  // double-click the page to hide the bars for an uncluttered read
  $("stage").addEventListener("dblclick", () => $("reader").classList.toggle("immersive"));

  document.addEventListener("keydown", (e) => {
    if ($("reader").classList.contains("hidden")) { if (e.key === "Enter") open(1); return; }
    if (!$("grid").classList.contains("hidden")) { if (e.key === "Escape") closeGrid(); return; }
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (mode !== "scroll" && ["arrowright", "d", " ", "pagedown"].includes(k)) { e.preventDefault(); next(); }
    else if (mode !== "scroll" && ["arrowleft", "a", "pageup"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "home") go(1);
    else if (k === "end") go(N);
    else if (k === "g") openGrid();
    else if (k === "f") $("fsBtn").click();
    else if (k === "h") $("reader").classList.toggle("immersive");
    else if (k === "escape") home();
  });

  // swipe to turn pages (single and spread modes)
  let sx = null, sy = 0;
  $("stage").addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null;
  }, { passive: true });
  $("stage").addEventListener("touchend", (e) => {
    if (sx === null || (window.visualViewport && visualViewport.scale > 1.01)) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? next : prev)();
    sx = null;
  });

  addEventListener("resize", () => { if (mode !== "scroll" && !$("reader").classList.contains("hidden")) render(); });

  const m = location.hash.match(/^#p(\d+)$/);
  if (m) open(Math.max(1, Math.min(N, +m[1])));
})();
</script>
</body>
</html>
