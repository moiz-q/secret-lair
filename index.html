<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Lair</title>
<meta name="description" content="Secret Lair, Volume 1: Field of Thorns.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e10">
<meta property="og:type" content="website">
<meta property="og:title" content="Secret Lair">
<meta property="og:description" content="Volume 1: Field of Thorns">
<meta property="og:image" content="https://moiz-q.github.io/secret-lair/cover.jpg">
<meta property="og:url" content="https://moiz-q.github.io/secret-lair/">

<style>
:root {
  --bg: #0e0e10; --bar: rgba(14,14,16,.92); --text: #ecebe6; --muted: #9a9890;
  --line: #2a2a2e; --accent: #c8423f; --chip: #1c1c20;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- landing ---------- */
#landing { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.land { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 380px); gap: 48px; align-items: center; max-width: 820px; }
.land img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.land h1 { font-size: clamp(40px, 7vw, 64px); line-height: .95; letter-spacing: .02em; margin: 0 0 12px;
  text-transform: uppercase; font-weight: 800; }
.land .vol { color: var(--muted); margin: 0 0 2px; }
.land .ch { margin: 0 0 28px; font-weight: 600; }
.cta { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 11px 20px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn:focus-visible, .icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.chapters { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 8px; }
.chapters button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; border-radius: 10px;
  background: var(--chip); text-align: left; }
.chapters button:hover { background: #26262b; }
.chapters button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.chapters img { width: 44px; height: 66px; aspect-ratio: auto; object-fit: cover; border-radius: 3px; box-shadow: none; flex: none; }
.chapters b { display: block; font-weight: 600; }
.chapters small { color: var(--muted); font-size: 13px; }
@media (max-width: 700px) {
  .land { grid-template-columns: 1fr; gap: 24px; text-align: center; }
  .land img { max-width: 260px; margin: 0 auto; }
  .chapters img { margin: 0; }
  .cta { justify-content: center; }
}

/* ---------- reader ---------- */
#reader { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--bar); border-bottom: 1px solid var(--line); z-index: 3; transition: transform .25s, opacity .25s; }
.bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.bar .title { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; margin-right: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.icon { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: var(--text); }
.icon:hover { background: var(--chip); }
.icon svg { width: 20px; height: 20px; }
.modes { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; margin: 0 6px; }
.modes button { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: #33333a; color: var(--text); }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 64px; text-align: center; }
input[type=range] { flex: 1; accent-color: var(--accent); min-width: 80px; }
#reader.immersive .bar.top { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar.bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
#reader.immersive .bar { position: absolute; left: 0; right: 0; }
#reader.immersive .bar.top { top: 0; } #reader.immersive .bar.bottom { bottom: 0; }

.stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 10px; user-select: none; touch-action: pan-y pinch-zoom; }
.stage .spread { display: flex; height: 100%; max-width: 100%; align-items: center; justify-content: center; gap: 0; }
.stage img { display: block; max-height: 100%; max-width: 100%; height: auto; width: auto; object-fit: contain;
  background: #1a1a1d; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.stage .spread.two img { max-width: 50%; }
.stage .spread.wide img { max-width: 100%; }
.hit { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 2; }
.hit.l { left: 0; cursor: w-resize; } .hit.r { right: 0; cursor: e-resize; }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 0 40px; }
.scroll img { display: block; width: min(100%, 900px); height: auto; margin: 0 auto 14px; aspect-ratio: 2/3; background: #1a1a1d; }
.scroll img.wide { width: min(100%, 1800px); aspect-ratio: 4/3; }
.scroll .endcard { margin: 30px auto; }

/* ---------- thumbnails ---------- */
#grid { position: fixed; inset: 0; background: rgba(8,8,10,.97); z-index: 5; overflow-y: auto; padding: 16px; }
#grid header { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto 14px; }
#grid h2 { margin: 0; font-size: 16px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 16px; }
.tabs button { padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.bar .title { cursor: pointer; }
.endcard .btn { margin: 4px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.thumbs button { text-align: center; color: var(--muted); font-size: 12px; }
.thumbs img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 3px; border: 2px solid transparent; display: block; margin-bottom: 4px; }
.thumbs button.current img { border-color: var(--accent); }

/* ---------- end card ---------- */
.endcard { max-width: 420px; text-align: center; padding: 32px 20px; }
.endcard h2 { text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
.endcard p { color: var(--muted); margin: 0 0 22px; }

.hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75);
  color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px; pointer-events: none;
  transition: opacity .6s; z-index: 4; white-space: nowrap; }
@media (max-width: 640px) {
  .bar .title span, .hide-sm { display: none; }
  .modes button { padding: 6px 8px; }
}
</style>
</head>
<body>

<section id="landing">
  <div class="land">
    <img id="coverImg" alt="The title page: the old harbour's dead cranes at dawn">
    <div>
      <h1>Secret<br>Lair</h1>
      <p class="vol">Volume 1: Field of Thorns</p>
      <p class="ch" id="chName"></p>
      <div class="cta">
        <button class="btn" id="startBtn">Start reading</button>
        <button class="btn ghost hidden" id="resumeBtn"></button>
      </div>
      <ul class="chapters hidden" id="chapList" aria-label="Chapters"></ul>
    </div>
  </div>
</section>

<section id="reader" class="hidden" aria-label="Comic reader">
  <div class="bar top">
    <button class="icon" id="homeBtn" aria-label="Back to cover" title="Cover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title" id="barTitle" title="Chapters and pages">Secret Lair<span id="barChapter"></span></div>
    <div class="modes" role="group" aria-label="Reading mode">
      <button data-mode="single" aria-pressed="false" title="One page at a time">Page</button>
      <button data-mode="double" aria-pressed="false" title="Two-page spreads">Spread</button>
      <button data-mode="scroll" aria-pressed="false" title="Scroll down through every page">Scroll</button>
    </div>
    <button class="icon" id="gridBtn" aria-label="All pages" title="All pages (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
    <button class="icon hide-sm" id="fsBtn" aria-label="Full screen" title="Full screen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="spread" id="spread"></div>
    <button class="hit l" id="hitL" aria-label="Previous page"></button>
    <button class="hit r" id="hitR" aria-label="Next page"></button>
    <div class="hint" id="hint">Tap the sides or use ← → to turn pages</div>
  </div>
  <div class="scroll hidden" id="scroll"></div>

  <div class="bar bottom" id="bottomBar">
    <button class="icon" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <input type="range" id="slider" min="1" value="1" aria-label="Page">
    <span class="counter" id="counter"></span>
    <button class="icon" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<section id="grid" class="hidden" aria-label="All pages">
  <header><h2 id="gridTitle">All pages</h2>
    <button class="icon" id="gridClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></header>
  <div class="tabs hidden" id="tabs" role="group" aria-label="Chapter"></div>
  <div class="thumbs" id="thumbs"></div>
</section>

<script>
const BOOK = {"title": "Secret Lair", "volume": "Volume 1: Field of Thorns", "chapters": [{"n": 1, "name": "Chapter 1: Roots", "pages": [{"n": 1, "src": "pages/c1/01.webp", "thumb": "pages/c1/01_t.webp", "alt": "Twenty-three years ago, the sky went white for nine seconds. No one could explain it. By morning, most people had stopped trying.", "title_page": false}, {"n": 2, "src": "pages/c1/02.webp", "thumb": "pages/c1/02_t.webp", "alt": "Nine months later, the first children were born different.", "title_page": false}, {"n": 3, "src": "pages/c1/03.webp", "thumb": "pages/c1/03_t.webp", "alt": "They called it the Shift. The children were Shifted. Everyone else got a word they'd never needed before. Constant.", "title_page": false}, {"n": 4, "src": "pages/c1/04.webp", "thumb": "pages/c1/04_t.webp", "alt": "At first, the world called it a miracle. Then it called it a problem. Then it called it an opportunity. 1147", "title_page": false}, {"n": 5, "src": "pages/c1/05.webp", "thumb": "pages/c1/05_t.webp", "alt": "Some of the Shifted decided they didn't need anyone's permission. They came at dusk. People started calling them Vesper.", "title_page": false}, {"n": 6, "src": "pages/c1/06.webp", "thumb": "pages/c1/06_t.webp", "alt": "Fifteen years ago, Vesper came to Asheford. Stay with me. Hey. Stay with me. The city survived. Not everyone came out whole.", "title_page": false}, {"n": 7, "src": "pages/c1/07.webp", "thumb": "pages/c1/07_t.webp", "alt": "", "title_page": false}, {"n": 8, "src": "pages/c1/08.webp", "thumb": "pages/c1/08_t.webp", "alt": "Harbour Night: the burning harbour, full page with no words. Turn your device sideways.", "title_page": false}, {"n": 9, "src": "pages/c1/09.webp", "thumb": "pages/c1/09_t.webp", "alt": "FIFTEEN YEARS LATER SECRET LAIR Field of Thorns · Chapter 1: Roots", "title_page": true}, {"n": 10, "src": "pages/c1/10.webp", "thumb": "pages/c1/10_t.webp", "alt": "", "title_page": false}, {"n": 11, "src": "pages/c1/11.webp", "thumb": "pages/c1/11_t.webp", "alt": "You'll open it for us.", "title_page": false}, {"n": 12, "src": "pages/c1/12.webp", "thumb": "pages/c1/12_t.webp", "alt": "", "title_page": false}, {"n": 13, "src": "pages/c1/13.webp", "thumb": "pages/c1/13_t.webp", "alt": "Intake Thirty-One. Forty of us. They say it's the best year the Corps has had in a decade.", "title_page": false}, {"n": 14, "src": "pages/c1/14.webp", "thumb": "pages/c1/14_t.webp", "alt": "Every month, they post the rankings. Mum: Happy birthday, love. 22!! x 34 · 35 · 36 ROKA · 37 I'm thirty-sixth.", "title_page": false}, {"n": 15, "src": "pages/c1/15.webp", "thumb": "pages/c1/15_t.webp", "alt": "You look like you slept in a hedge. Thanks. You've got a follower. He's been with me since the bakery. I keep telling him I can't afford him. Assessment today. I know. Mattyes is grading. I know.", "title_page": false}, {"n": 16, "src": "pages/c1/16.webp", "thumb": "pages/c1/16_t.webp", "alt": "Did you sleep here? No. Is it still pulling? Drifted right under load. Fixed it. Mostly.", "title_page": false}, {"n": 17, "src": "pages/c1/17.webp", "thumb": "pages/c1/17_t.webp", "alt": "Twelve civilians. Six hostiles. Drones are hostiles. Dummies are civilians. Try not to mix them up. Vest goes red, you're out. First group. Go.", "title_page": false}, {"n": 18, "src": "pages/c1/18.webp", "thumb": "pages/c1/18_t.webp", "alt": "Jeon. Ranked first. Eleven seconds. Didn't even touch the dummies.", "title_page": false}, {"n": 19, "src": "pages/c1/19.webp", "thumb": "pages/c1/19_t.webp", "alt": "Cas. Pass. Shibby. Pass. Anna. Pass. Azelax. Pass. Rassy. Pass. Pearl. Pass.", "title_page": false}, {"n": 20, "src": "pages/c1/20.webp", "thumb": "pages/c1/20_t.webp", "alt": "Good reflexes. Good night vision. Next. Next group.", "title_page": false}, {"n": 21, "src": "pages/c1/21.webp", "thumb": "pages/c1/21_t.webp", "alt": "Roka. Out.", "title_page": false}, {"n": 22, "src": "pages/c1/22.webp", "thumb": "pages/c1/22_t.webp", "alt": "…Moiz. Pass. Support track? Plants. Good for search and rescue. …Maybe.", "title_page": false}, {"n": 23, "src": "pages/c1/23.webp", "thumb": "pages/c1/23_t.webp", "alt": "You know what my file says? \"Good reflexes. Good night vision.\" That's it. That's the whole entry. And the cats. And every cat in the city thinks I'm their mum. They left that bit out. Everyone else's power is an answer.", "title_page": false}, {"n": 24, "src": "pages/c1/24.webp", "thumb": "pages/c1/24_t.webp", "alt": "Mine's a garden. I didn't get one at all. Built the first one of these out of scrap when I was fourteen. Weighed a ton. Caught fire twice.", "title_page": false}, {"n": 25, "src": "pages/c1/25.webp", "thumb": "pages/c1/25_t.webp", "alt": "Your power isn't the problem. Nobody's shown you what it's for yet. Hey. You weren't eating it.", "title_page": false}, {"n": 26, "src": "pages/c1/26.webp", "thumb": "pages/c1/26_t.webp", "alt": "Next week's field exercise. Search and rescue. Old harbour district. Inside the fence? Inside the fence. First Intake that's ever been let in.", "title_page": false}, {"n": 27, "src": "pages/c1/27.webp", "thumb": "pages/c1/27_t.webp", "alt": "Teams go up tonight. Dismissed.", "title_page": false}, {"n": 28, "src": "pages/c1/28.webp", "thumb": "pages/c1/28_t.webp", "alt": "Leena: you thought we forgot didn't you Leena: check your bag Moiz: Happy 22nd, Roka. Same roof next year.", "title_page": false}, {"n": 29, "src": "pages/c1/29.webp", "thumb": "pages/c1/29_t.webp", "alt": "The flowers… They're all facing the same way. …Towards the harbour.", "title_page": false}, {"n": 30, "src": "pages/c1/30.webp", "thumb": "pages/c1/30_t.webp", "alt": "Fifteen years.", "title_page": false}], "spreads": [], "cover": "pages/c1/09.webp", "thumb": "pages/c1/09_t.webp"}, {"n": 2, "name": "Chapter 2: The Week", "pages": [{"n": 1, "src": "pages/c2/01.webp", "thumb": "pages/c2/01_t.webp", "alt": "It's a seedling. In a little pot. Moiz made a tag for it. Of course he did. Mum. They're sending us into the old harbour. Next week. A rescue drill. …Mum? …Be careful in there. Stay with the others. Promise me.", "title_page": true}, {"n": 2, "src": "pages/c2/02.webp", "thumb": "pages/c2/02_t.webp", "alt": "TEAM FOUR · Roka · Leena · Moiz · Pearl · Tuna", "title_page": false}, {"n": 3, "src": "pages/c2/03.webp", "thumb": "pages/c2/03_t.webp", "alt": "Leena: who's tuna Roka: no idea Tuna: the guy who sits behind you in briefings, roka Tuna: see you all tomorrow!! Moiz: Pearl. Leena: be nice", "title_page": false}, {"n": 4, "src": "pages/c2/04.webp", "thumb": "pages/c2/04_t.webp", "alt": "Team Four! Roka. Leena. Moiz. Pearl's late. I'm not late. You're about to be. Your heart's going like you ran here. …Okay. I like him.", "title_page": false}, {"n": 5, "src": "pages/c2/05.webp", "thumb": "pages/c2/05_t.webp", "alt": "You can hear heartbeats? Everyone's. All the time. These help. Mostly. Search and rescue, though. Finally a drill where I'm actually useful. Team Four. Course. Now.", "title_page": false}, {"n": 6, "src": "pages/c2/06.webp", "thumb": "pages/c2/06_t.webp", "alt": "Team Four. Three civilians. Go. Thirty seconds and their sensors are blind— Done. Civilian crushed. Tuna, you're out. …Ow?", "title_page": false}, {"n": 7, "src": "pages/c2/07.webp", "thumb": "pages/c2/07_t.webp", "alt": "All five out. Zero civilians saved. Again. You could've said you were using it. You could've waited thirty seconds. Children. Four hours later. Again. My heart's fine, by the way. Nobody asked.", "title_page": false}, {"n": 8, "src": "pages/c2/08.webp", "thumb": "pages/c2/08_t.webp", "alt": "Mattyes says we build the team radios. Together. Sit. Three hours in. You drew all of these? Since I was eight. I built the arm myself.", "title_page": false}, {"n": 9, "src": "pages/c2/09.webp", "thumb": "pages/c2/09_t.webp", "alt": "The wrist joint. You rebuilt it. Four times. It still slips. Your connector's the wrong size. I know. Nobody makes one that small. Later. Pearl's gone home. She made one. The right size. …It fits.", "title_page": false}, {"n": 10, "src": "pages/c2/10.webp", "thumb": "pages/c2/10_t.webp", "alt": "Wednesday. I cut it back on Monday. It's grown through the tape overnight. Am I doing this in my sleep? …Fine. Stay.", "title_page": false}, {"n": 11, "src": "pages/c2/11.webp", "thumb": "pages/c2/11_t.webp", "alt": "Thursday. Cards are a classic. Cards are a magic trick. Sorry— sorry—! …Show-off. You're welcome.", "title_page": false}, {"n": 12, "src": "pages/c2/12.webp", "thumb": "pages/c2/12_t.webp", "alt": "We are not doing this. She likes you. Anna's wing's sprained. She won't tell anyone. Cas owes Shibby lunch. How do you know all that? I listen.", "title_page": false}, {"n": 13, "src": "pages/c2/13.webp", "thumb": "pages/c2/13_t.webp", "alt": "Friday. Faster than Monday. Still a mess. Jeon. Ranked first. Practising alone, at night?", "title_page": false}, {"n": 14, "src": "pages/c2/14.webp", "thumb": "pages/c2/14_t.webp", "alt": "You can come out. I thought it was easy for you. It looks easy. That's the point. Your vines. On the assessment. They grew around the dummies. Not through them. …I didn't notice. That's control. Took me two years to learn it.", "title_page": false}, {"n": 15, "src": "pages/c2/15.webp", "thumb": "pages/c2/15_t.webp", "alt": "Saturday. In the park, every flower still faces the harbour. They won't go in. Any of them. Something in there's scaring them.", "title_page": false}, {"n": 16, "src": "pages/c2/16.webp", "thumb": "pages/c2/16_t.webp", "alt": "Couldn't sleep. Me neither.", "title_page": false}, {"n": 17, "src": "pages/c2/17.webp", "thumb": "pages/c2/17_t.webp", "alt": "I was eight when the harbour burned. I don't remember much. Fire. Noise. Shoes. Someone walked right past me. Didn't even slow down.", "title_page": false}, {"n": 18, "src": "pages/c2/18.webp", "thumb": "pages/c2/18_t.webp", "alt": "…Thanks. I didn't do anything. You stayed.", "title_page": false}, {"n": 19, "src": "pages/c2/19.webp", "thumb": "pages/c2/19_t.webp", "alt": "Sunday. Channel four. Don't touch the dial. Everyone's heart's going way too fast. Mine too. Tomorrow's the harbour. Wow. Thanks, Tuna. Very calming.", "title_page": false}, {"n": 20, "src": "pages/c2/20.webp", "thumb": "pages/c2/20_t.webp", "alt": "Stay with your team. Radios on. Lose your team, you come straight back to this gate. This is the Senior Warden, going in ahead of you. Any order from the Warden, you follow it. That scarf. I've seen it before. Where?", "title_page": false}, {"n": 21, "src": "pages/c2/21.webp", "thumb": "pages/c2/21_t.webp", "alt": "Team Four. Right on time.", "title_page": false}], "spreads": [], "cover": "pages/c2/01.webp", "thumb": "pages/c2/01_t.webp"}, {"n": 3, "name": "Chapter 3: Vesper", "pages": [{"n": 1, "src": "pages/c3/01.webp", "thumb": "pages/c3/01_t.webp", "alt": "The same morning. Gina. They're through the gate. All forty, inside the fence. Team Four? Right on schedule. Then come home. On my way.", "title_page": true}, {"n": 2, "src": "pages/c3/02.webp", "thumb": "pages/c3/02_t.webp", "alt": "LINE 4 - STATION CLOSED", "title_page": false}, {"n": 3, "src": "pages/c3/03.webp", "thumb": "pages/c3/03_t.webp", "alt": "Under the closed Line 4 station. This is where Vesper lives.", "title_page": false}, {"n": 4, "src": "pages/c3/04.webp", "thumb": "pages/c3/04_t.webp", "alt": "Zeyno. She's been lighting birthday candles since she was seven. Zeyno. Will the Corps find us down here? Not today. Make a wish.", "title_page": false}, {"n": 5, "src": "pages/c3/05.webp", "thumb": "pages/c3/05_t.webp", "alt": "Gina's back! Did you eat today? The cat did. Eat something. You, not the cat.", "title_page": false}, {"n": 6, "src": "pages/c3/06.webp", "thumb": "pages/c3/06_t.webp", "alt": "The far end of the platform. Where Vesper plans. Sicario. Gina's back. Good. Then we go now, while the gates are open. No. We wait for dusk. Forty trainees and a handful of Wardens. We could walk through them. We're not going for the trainees.", "title_page": false}, {"n": 7, "src": "pages/c3/07.webp", "thumb": "pages/c3/07_t.webp", "alt": "The Corps sent forty trainees inside the fence today. A search-and-rescue drill. The gates stay open until dusk. That's when we go in. Zaytoona. My bats are already over the fence. By tonight I'll know where every team is. Tacos. And the Wardens? Six of them. One I don't like. Checked scarf, curved blade. The one with the glowing blade. Then nobody goes near that one.", "title_page": false}, {"n": 8, "src": "pages/c3/08.webp", "thumb": "pages/c3/08_t.webp", "alt": "Aurora. He's listening to the dead again. It's louder today. The dead? Everyone who died on Harbour Night is still down there. But there's something under them. Something under the harbour is waking up.", "title_page": false}, {"n": 9, "src": "pages/c3/09.webp", "thumb": "pages/c3/09_t.webp", "alt": "Don't. It's loud enough in my head already. Sicario. Leave him alone. Unknown: Wardens pull back to Gate Three at 18:30. Unknown: Gate closes 19:40. Team positions attached. Unknown: Team Four will be closest to the old dock. Who keeps sending us these?", "title_page": false}, {"n": 10, "src": "pages/c3/10.webp", "thumb": "pages/c3/10_t.webp", "alt": "Someone inside the Corps who wants the same thing we do. That's not comforting. Dusk. Zaytoona's bats go first. Tacos, you take the cranes. Sicario, the gate. Aurora, you find what's waking up. I don't have to find it. I can hear it.", "title_page": false}, {"n": 11, "src": "pages/c3/11.webp", "thumb": "pages/c3/11_t.webp", "alt": "And me? He wants to see you first.", "title_page": false}, {"n": 12, "src": "pages/c3/12.webp", "thumb": "pages/c3/12_t.webp", "alt": "The man with no face. Vesper's leader. They're all inside the fence.", "title_page": false}, {"n": 13, "src": "pages/c3/13.webp", "thumb": "pages/c3/13_t.webp", "alt": "The girl with the vines? She's ranked thirty-sixth. She can barely grow a hedge. She's grown.", "title_page": false}, {"n": 14, "src": "pages/c3/14.webp", "thumb": "pages/c3/14_t.webp", "alt": "The Constant with the arm? He's nobody. I've never seen him look at anyone that long.", "title_page": false}, {"n": 15, "src": "pages/c3/15.webp", "thumb": "pages/c3/15_t.webp", "alt": "Afternoon. Do you think about them? If tonight goes wrong. Every day. That's why it can't go wrong. Fewer of us are born every year. The Shift is fading. Twenty more years and there won't be any more of us. They know that. They're just waiting us out.", "title_page": false}, {"n": 16, "src": "pages/c3/16.webp", "thumb": "pages/c3/16_t.webp", "alt": "And he can stop it? He's the only one who's tried. Orders. The girl with the vines comes back alive. Nobody touches her. And the rest of Team Four? He didn't say.", "title_page": false}, {"n": 17, "src": "pages/c3/17.webp", "thumb": "pages/c3/17_t.webp", "alt": "Stay down here tonight. I always do.", "title_page": false}, {"n": 18, "src": "pages/c3/18.webp", "thumb": "pages/c3/18_t.webp", "alt": "Dusk. Vesper night. Everybody inside. It knows we're coming.", "title_page": false}, {"n": 19, "src": "pages/c3/19.webp", "thumb": "pages/c3/19_t.webp", "alt": "Inside the fence. …and that's why Mattyes hates me. Mattyes hates everyone. …Hang on.", "title_page": false}, {"n": 20, "src": "pages/c3/20.webp", "thumb": "pages/c3/20_t.webp", "alt": "There are heartbeats out there. A lot of them. Other teams? No. They're coming toward us. A Vesper night.", "title_page": false}], "spreads": [], "cover": "pages/c3/01.webp", "thumb": "pages/c3/01_t.webp"}], "cover": "pages/c1/09.webp"};
(function () {
  const $ = (id) => document.getElementById(id);
  const CHAPTERS = BOOK.chapters;
  const store = {
    get(k) { try { return localStorage.getItem("secretlair-" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("secretlair-" + k, v); } catch (e) {} }
  };
  // Chapter 1 keeps the keys and links it had before there were chapters.
  const pageKey = (c) => c === 1 ? "page" : "page-c" + c;
  const hashFor = (c, p) => c === 1 ? "#p" + p : "#c" + c + "p" + p;
  const chapter = (n) => CHAPTERS.find((c) => c.n === n) || CHAPTERS[0];
  const wideScreen = () => innerWidth >= 1000 && innerWidth / innerHeight > 1.15;

  let CH = CHAPTERS[0], N = CH.pages.length, END = N + 1;   // END: a virtual "end of chapter" view
  let page = 1;
  let mode = store.get("mode") || (innerWidth < 700 ? "scroll" : wideScreen() ? "double" : "single");
  const spreadFor = (n) => CH.spreads.find((s) => s.pages.includes(n));

  function setChapter(n) {
    if (CH.n === n && $("scroll").childElementCount) return;
    CH = chapter(n); N = CH.pages.length; END = N + 1;
    $("barChapter").textContent = CH.name;
    $("slider").max = N;
    $("scroll").innerHTML = "";
    store.set("chapter", String(CH.n));
  }

  // Which pages are shown together for a given page, in the current mode.
  function viewFor(n) {
    if (n >= END) return { end: true };
    const s = spreadFor(n);
    if (s) return { spread: s };            // a double-page spread is never cut in half
    if (mode === "double") {
      if (n === 1) return { pages: [1] };                     // page 1 sits alone, like a book's first right-hand page
      const left = n % 2 === 0 ? n : n - 1;                   // even pages on the left
      return { pages: [left, left + 1].filter((p) => p <= N) };
    }
    return { pages: [n] };
  }
  const first = (v) => v.end ? END : v.spread ? v.spread.pages[0] : v.pages[0];
  const last = (v) => v.end ? END : v.spread ? v.spread.pages[1] : v.pages[v.pages.length - 1];

  function img(p, eager) {
    const im = new Image();
    im.src = CH.pages[p - 1].src;
    im.alt = "Page " + p + (CH.pages[p - 1].alt ? ": " + CH.pages[p - 1].alt : "");
    im.decoding = "async";
    if (!eager) im.loading = "lazy";
    im.width = 1600; im.height = 2400;
    return im;
  }

  function endCard() {
    const d = document.createElement("div");
    d.className = "endcard";
    const nxt = CHAPTERS[CHAPTERS.indexOf(CH) + 1];
    d.innerHTML = "<h2>End of Chapter " + CH.n + "</h2><p>Secret Lair · " + BOOK.volume + "</p>";
    if (nxt) {
      const n = document.createElement("button");
      n.className = "btn"; n.textContent = "Next: " + nxt.name;

    const b = document.createElement("button");
